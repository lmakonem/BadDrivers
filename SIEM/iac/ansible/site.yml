---
# SOCFortress CoPilot SIEM/SOAR Master Playbook
# Deploys complete 3-VM stack with MISP threat intelligence

- name: Pre-flight checks
  hosts: all
  gather_facts: yes
  tasks:
    - name: Verify minimum RAM
      assert:
        that:
          - ansible_memtotal_mb >= 14000
        fail_msg: "Minimum 16GB RAM required"
    
    - name: Verify Docker installed
      command: docker --version
      register: docker_check
      changed_when: false
      failed_when: docker_check.rc != 0

# ============================================================================
# VM1: SIEM-Data (Wazuh Indexer + MongoDB)
# ============================================================================
- name: Deploy VM1 - SIEM-Data
  hosts: vm1_siem_data
  become: yes
  roles:
    - common
    - docker
    - wazuh-indexer

# ============================================================================
# VM2: SIEM-CoPilot-Detect (Wazuh Manager + Graylog + MISP + Shuffle)
# ============================================================================
- name: Deploy VM2 - SIEM-CoPilot-Detect
  hosts: vm2_siem_detect
  become: yes
  roles:
    - common
    - docker
    - wazuh-manager
    - graylog
    - misp

# ============================================================================
# VM3: SIEM-CoPilot-Mgmt (CoPilot + Grafana + Velociraptor)
# ============================================================================
- name: Deploy VM3 - SIEM-CoPilot-Mgmt
  hosts: vm3_siem_mgmt
  become: yes
  roles:
    - common
    - docker
    - copilot
    - grafana
    - velociraptor

# ============================================================================
# Post-deployment configuration
# ============================================================================
- name: Post-deployment tasks
  hosts: all
  become: yes
  tasks:
    - name: Display deployment summary
      debug:
        msg: |
          ============================================
          SIEM Stack Deployment Complete!
          ============================================
          
          CoPilot UI:     https://{{ network.vm3_ip }}
          Wazuh Dashboard: https://{{ network.vm2_ip }}:5601
          Graylog:        http://{{ network.vm2_ip }}:9000
          Grafana:        http://{{ network.vm3_ip }}:3000
          MISP:           https://{{ network.vm2_ip }}:8443
          Velociraptor:   https://{{ network.vm3_ip }}:8889
          
          Default credentials in group_vars/all.yml
          ============================================
      run_once: true
