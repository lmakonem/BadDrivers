---
# Wazuh Manager deployment role for VM2

- name: Create Wazuh Manager directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /opt/siem/wazuh-manager
    - /opt/siem/wazuh-manager/certs
    - /opt/siem/wazuh-manager/config

- name: Copy SSL certificates
  copy:
    src: "{{ item.src }}"
    dest: "/opt/siem/wazuh-manager/certs/{{ item.dest }}"
    mode: '0644'
  loop:
    - { src: "certs/root-ca.pem", dest: "root-ca.pem" }
    - { src: "certs/filebeat.pem", dest: "filebeat.pem" }
    - { src: "certs/filebeat-key.pem", dest: "filebeat-key.pem" }

- name: Template ossec.conf
  template:
    src: ossec.conf.j2
    dest: /opt/siem/wazuh-manager/config/ossec.conf
    mode: '0644'

- name: Copy Docker Compose file
  template:
    src: docker-compose.yml.j2
    dest: /opt/siem/wazuh-manager/docker-compose.yml
    mode: '0644'

- name: Create .env file
  template:
    src: env.j2
    dest: /opt/siem/wazuh-manager/.env
    mode: '0600'

- name: Start Wazuh Manager stack
  community.docker.docker_compose_v2:
    project_src: /opt/siem/wazuh-manager
    state: present
  register: manager_compose

- name: Wait for Wazuh Manager API to be ready
  uri:
    url: "https://localhost:55000"
    method: GET
    user: "{{ wazuh.manager.api_user }}"
    password: "{{ wazuh.manager.api_password }}"
    validate_certs: no
    status_code: 200
  register: manager_health
  until: manager_health.status == 200
  retries: 30
  delay: 10

- name: Create health fix script
  copy:
    content: |
      #!/bin/bash
      # Fix for Wazuh Manager daemons restarting issue
      if docker exec wazuh-manager /var/ossec/bin/wazuh-control status 2>/dev/null | grep -q "not running"; then
        docker exec wazuh-manager /var/ossec/bin/wazuh-control restart
      fi
    dest: /opt/siem/scripts/wazuh-health-fix.sh
    mode: '0755'

- name: Setup health fix cron job
  cron:
    name: "Wazuh Manager health check"
    minute: "*/5"
    job: "/opt/siem/scripts/wazuh-health-fix.sh >> /var/log/wazuh-health.log 2>&1"
