---
# Wazuh Indexer (OpenSearch) deployment role for VM1

- name: Create Wazuh Indexer directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /opt/siem/wazuh-indexer
    - /opt/siem/wazuh-indexer/certs
    - /opt/siem/wazuh-indexer/config

- name: Copy SSL certificates
  copy:
    src: "{{ item.src }}"
    dest: "/opt/siem/wazuh-indexer/certs/{{ item.dest }}"
    mode: '0644'
  loop:
    - { src: "certs/root-ca.pem", dest: "root-ca.pem" }
    - { src: "certs/indexer.pem", dest: "indexer.pem" }
    - { src: "certs/indexer-key.pem", dest: "indexer-key.pem" }
    - { src: "certs/admin.pem", dest: "admin.pem" }
    - { src: "certs/admin-key.pem", dest: "admin-key.pem" }

- name: Template OpenSearch configuration
  template:
    src: opensearch.yml.j2
    dest: /opt/siem/wazuh-indexer/config/opensearch.yml
    mode: '0644'

- name: Copy Docker Compose file
  template:
    src: docker-compose.yml.j2
    dest: /opt/siem/wazuh-indexer/docker-compose.yml
    mode: '0644'

- name: Create .env file
  template:
    src: env.j2
    dest: /opt/siem/wazuh-indexer/.env
    mode: '0600'

- name: Start Wazuh Indexer stack
  community.docker.docker_compose_v2:
    project_src: /opt/siem/wazuh-indexer
    state: present
  register: indexer_compose

- name: Wait for Wazuh Indexer to be ready
  uri:
    url: "https://localhost:9200"
    method: GET
    user: admin
    password: "{{ wazuh.indexer.admin_password }}"
    validate_certs: no
    status_code: 200
  register: indexer_health
  until: indexer_health.status == 200
  retries: 30
  delay: 10

- name: Run security admin script to initialize security
  community.docker.docker_container_exec:
    container: wazuh-indexer
    command: >
      /usr/share/wazuh-indexer/plugins/opensearch-security/tools/securityadmin.sh
      -cd /usr/share/wazuh-indexer/plugins/opensearch-security/securityconfig/
      -icl -nhnv
      -cacert /usr/share/wazuh-indexer/certs/root-ca.pem
      -cert /usr/share/wazuh-indexer/certs/admin.pem
      -key /usr/share/wazuh-indexer/certs/admin-key.pem
      -h localhost
  register: security_init
  changed_when: "'Done with success' in security_init.stdout"
  failed_when: false
