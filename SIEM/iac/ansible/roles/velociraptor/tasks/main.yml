---
# Velociraptor deployment role for VM3

- name: Create Velociraptor directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /opt/siem/velociraptor
    - /opt/siem/velociraptor/config
    - /opt/siem/velociraptor/data

- name: Generate Velociraptor server config
  command: >
    docker run --rm velocidex/velociraptor:latest
    config generate --merge
    '{"Frontend":{"hostname":"{{ network.vm3_ip }}"},"GUI":{"bind_address":"0.0.0.0","bind_port":8889}}'
  register: velociraptor_config
  changed_when: false

- name: Write Velociraptor server config
  copy:
    content: "{{ velociraptor_config.stdout }}"
    dest: /opt/siem/velociraptor/config/server.config.yaml
    mode: '0600'
  when: velociraptor_config.stdout | length > 0

- name: Copy Velociraptor Docker Compose file
  template:
    src: docker-compose.yml.j2
    dest: /opt/siem/velociraptor/docker-compose.yml
    mode: '0644'

- name: Start Velociraptor stack
  community.docker.docker_compose_v2:
    project_src: /opt/siem/velociraptor
    state: present
  register: velociraptor_compose

- name: Wait for Velociraptor to be ready
  uri:
    url: "https://localhost:{{ velociraptor.gui_port }}"
    method: GET
    validate_certs: no
    status_code: [200, 302]
  register: velociraptor_health
  until: velociraptor_health.status in [200, 302]
  retries: 30
  delay: 10

- name: Generate API config for CoPilot
  command: >
    docker exec velociraptor
    /velociraptor --config /etc/velociraptor/server.config.yaml
    config api_client --name CoPilot
    --role administrator
  register: api_config
  changed_when: "'api_client_id' in api_config.stdout"
  failed_when: false

- name: Save API config
  copy:
    content: "{{ api_config.stdout }}"
    dest: /opt/siem/velociraptor/config/api_client.yaml
    mode: '0600'
  when: api_config.rc == 0

- name: Create admin user
  command: >
    docker exec velociraptor
    /velociraptor --config /etc/velociraptor/server.config.yaml
    user add {{ velociraptor.admin_user }} {{ velociraptor.admin_password }}
    --role administrator
  register: admin_create
  changed_when: "'created' in admin_create.stdout"
  failed_when: false
