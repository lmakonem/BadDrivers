---
# Graylog deployment role for VM2

- name: Create Graylog directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /opt/siem/graylog
    - /opt/siem/graylog/config
    - /opt/siem/graylog/pipelines
    - /opt/siem/graylog/extractors

- name: Copy Graylog configuration files
  template:
    src: "{{ item.src }}"
    dest: "/opt/siem/graylog/config/{{ item.dest }}"
    mode: '0644'
  loop:
    - { src: "graylog.conf.j2", dest: "graylog.conf" }

- name: Copy pipeline configurations
  copy:
    src: "pipelines/"
    dest: "/opt/siem/graylog/pipelines/"
    mode: '0644'

- name: Copy extractor configurations
  copy:
    src: "extractors/"
    dest: "/opt/siem/graylog/extractors/"
    mode: '0644'

- name: Wait for Graylog to be ready
  uri:
    url: "http://localhost:{{ graylog.http_port }}/api/system/lbstatus"
    method: GET
    status_code: 200
  register: graylog_health
  until: graylog_health.status == 200
  retries: 30
  delay: 10

- name: Create Wazuh Syslog UDP input
  uri:
    url: "http://localhost:{{ graylog.http_port }}/api/system/inputs"
    method: POST
    user: "{{ graylog.admin_user }}"
    password: "{{ graylog.admin_password }}"
    force_basic_auth: yes
    body_format: json
    body:
      title: "Wazuh Syslog UDP"
      type: "org.graylog2.inputs.syslog.udp.SyslogUDPInput"
      configuration:
        bind_address: "0.0.0.0"
        port: 514
        recv_buffer_size: 262144
        number_worker_threads: 4
      global: true
    status_code: [200, 201, 400]
  register: wazuh_input
  changed_when: wazuh_input.status == 201

- name: Create Meraki Raw UDP input
  uri:
    url: "http://localhost:{{ graylog.http_port }}/api/system/inputs"
    method: POST
    user: "{{ graylog.admin_user }}"
    password: "{{ graylog.admin_password }}"
    force_basic_auth: yes
    body_format: json
    body:
      title: "Meraki Raw UDP"
      type: "org.graylog2.inputs.raw.udp.RawUDPInput"
      configuration:
        bind_address: "0.0.0.0"
        port: 5514
        recv_buffer_size: 262144
        number_worker_threads: 2
      global: true
    status_code: [200, 201, 400]
  register: meraki_input
  changed_when: meraki_input.status == 201

- name: Create GELF UDP input
  uri:
    url: "http://localhost:{{ graylog.http_port }}/api/system/inputs"
    method: POST
    user: "{{ graylog.admin_user }}"
    password: "{{ graylog.admin_password }}"
    force_basic_auth: yes
    body_format: json
    body:
      title: "GELF UDP"
      type: "org.graylog2.inputs.gelf.udp.GELFUDPInput"
      configuration:
        bind_address: "0.0.0.0"
        port: 12201
        recv_buffer_size: 262144
      global: true
    status_code: [200, 201, 400]
  register: gelf_input
  changed_when: gelf_input.status == 201

- name: Create Graylog to Wazuh Indexer sync script
  template:
    src: sync-graylog-to-wazuh.sh.j2
    dest: /opt/siem/scripts/sync-graylog-to-wazuh.sh
    mode: '0755'

- name: Setup Graylog sync cron job
  cron:
    name: "Sync Graylog to Wazuh Indexer"
    minute: "*/5"
    job: "/opt/siem/scripts/sync-graylog-to-wazuh.sh >> /var/log/graylog-sync.log 2>&1"
