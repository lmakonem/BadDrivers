---
# SOCFortress CoPilot SIEM/SOAR Infrastructure
# Ansible Inventory

all:
  vars:
    ansible_user: localuser
    ansible_ssh_pass: "{{ vault_ssh_password }}"
    ansible_become: true
    ansible_become_password: "{{ vault_ssh_password }}"
    ansible_python_interpreter: /usr/bin/python3

  children:
    siem:
      children:
        data_nodes:
          hosts:
            siem-data:
              ansible_host: 172.16.0.83
              vm_role: data
              vmid: 106

        detection_nodes:
          hosts:
            siem-detect:
              ansible_host: 172.16.0.53
              vm_role: detect
              vmid: 107

        management_nodes:
          hosts:
            siem-mgmt:
              ansible_host: 172.16.0.86
              vm_role: mgmt
              vmid: 108

    proxmox:
      hosts:
        pve03:
          ansible_host: 172.16.0.41
          ansible_user: root
