---
# VM1: SIEM-Data - Wazuh Indexer (OpenSearch)
# Docker Compose for data/indexing layer

version: "3.8"

services:
  wazuh-indexer:
    image: wazuh/wazuh-indexer:${WAZUH_VERSION:-4.7.2}
    container_name: wazuh-indexer
    hostname: wazuh-indexer
    restart: unless-stopped
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms4g -Xmx4g"
      - "bootstrap.memory_lock=true"
      - "discovery.type=single-node"
      - "plugins.security.ssl.http.enabled=true"
      - "plugins.security.ssl.http.pemcert_filepath=/usr/share/wazuh-indexer/certs/indexer.pem"
      - "plugins.security.ssl.http.pemkey_filepath=/usr/share/wazuh-indexer/certs/indexer-key.pem"
      - "plugins.security.ssl.http.pemtrustedcas_filepath=/usr/share/wazuh-indexer/certs/root-ca.pem"
      - "plugins.security.ssl.transport.pemcert_filepath=/usr/share/wazuh-indexer/certs/indexer.pem"
      - "plugins.security.ssl.transport.pemkey_filepath=/usr/share/wazuh-indexer/certs/indexer-key.pem"
      - "plugins.security.ssl.transport.pemtrustedcas_filepath=/usr/share/wazuh-indexer/certs/root-ca.pem"
      - "plugins.security.authcz.admin_dn=CN=admin,OU=SIEM,O=SOCFortress,L=Austin,ST=Texas,C=US"
      - "plugins.security.nodes_dn=CN=wazuh-indexer,OU=SIEM,O=SOCFortress,L=Austin,ST=Texas,C=US"
      - "plugins.security.restapi.roles_enabled=[\"all_access\", \"security_rest_api_access\"]"
      - "cluster.name=${CLUSTER_NAME:-wazuh-cluster}"
      - "node.name=wazuh-indexer"
      - "network.host=0.0.0.0"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh_indexer_data:/var/lib/wazuh-indexer
      - ./certs:/usr/share/wazuh-indexer/certs:ro
      - ./config/opensearch.yml:/usr/share/wazuh-indexer/config/opensearch.yml:ro
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - siem-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:9200 -u admin:${INDEXER_PASSWORD:-SecretPassword123!} | grep -q 'wazuh-indexer'"]
      interval: 30s
      timeout: 10s
      retries: 5

  mongodb:
    image: mongo:6.0
    container_name: mongodb
    hostname: mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-MongoPass123!}
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - siem-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  wazuh_indexer_data:
    driver: local
  mongodb_data:
    driver: local

networks:
  siem-network:
    driver: bridge
    name: siem-network
