---
# VM2: SIEM-CoPilot-Detect - Wazuh Manager, Graylog, MISP, Shuffle
# Docker Compose for detection/processing layer

version: "3.8"

services:
  # ==========================================================================
  # WAZUH MANAGER
  # ==========================================================================
  wazuh-manager:
    image: wazuh/wazuh-manager:${WAZUH_VERSION:-4.7.2}
    container_name: wazuh-manager
    hostname: wazuh-manager
    restart: unless-stopped
    environment:
      - INDEXER_URL=https://${VM1_IP:-172.16.0.83}:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${INDEXER_PASSWORD:-SecretPassword123!}
      - FILEBEAT_SSL_VERIFICATION_MODE=none
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat-key.pem
      - API_USERNAME=${WAZUH_API_USER:-wazuh-wui}
      - API_PASSWORD=${WAZUH_API_PASSWORD:-WazuhApiPass123!}
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./certs:/etc/ssl:ro
      - ./config/ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro
    ports:
      - "1514:1514"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
    networks:
      - siem-network
    healthcheck:
      test: ["CMD-SHELL", "/var/ossec/bin/wazuh-control status | grep -q 'is running'"]
      interval: 60s
      timeout: 30s
      retries: 5

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:${WAZUH_VERSION:-4.7.2}
    container_name: wazuh-dashboard
    hostname: wazuh-dashboard
    restart: unless-stopped
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${INDEXER_PASSWORD:-SecretPassword123!}
      - WAZUH_API_URL=https://wazuh-manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=kibanaserver
      - API_USERNAME=${WAZUH_API_USER:-wazuh-wui}
      - API_PASSWORD=${WAZUH_API_PASSWORD:-WazuhApiPass123!}
    volumes:
      - ./certs:/usr/share/wazuh-dashboard/certs:ro
      - wazuh_dashboard_config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh_dashboard_custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    ports:
      - "5601:5601"
    networks:
      - siem-network
    depends_on:
      - wazuh-manager

  # ==========================================================================
  # GRAYLOG STACK
  # ==========================================================================
  graylog-opensearch:
    image: opensearchproject/opensearch:2.14.0
    container_name: graylog-opensearch
    hostname: graylog-opensearch
    restart: unless-stopped
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"
      - "bootstrap.memory_lock=true"
      - "discovery.type=single-node"
      - "action.auto_create_index=true"
      - "plugins.security.disabled=true"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - graylog_opensearch_data:/usr/share/opensearch/data
    ports:
      - "9201:9200"
    networks:
      - siem-network

  graylog:
    image: graylog/graylog:${GRAYLOG_VERSION:-5.2}
    container_name: graylog
    hostname: graylog
    restart: unless-stopped
    environment:
      - GRAYLOG_PASSWORD_SECRET=${GRAYLOG_PASSWORD_SECRET:-somepasswordpepper123456789012345678901234567890}
      - GRAYLOG_ROOT_PASSWORD_SHA2=${GRAYLOG_ROOT_PASSWORD_SHA2:-8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918}
      - GRAYLOG_HTTP_BIND_ADDRESS=0.0.0.0:9000
      - GRAYLOG_HTTP_EXTERNAL_URI=http://${VM2_IP:-172.16.0.53}:9000/
      - GRAYLOG_ELASTICSEARCH_HOSTS=http://graylog-opensearch:9200
      - GRAYLOG_MONGODB_URI=mongodb://admin:${MONGO_PASSWORD:-MongoPass123!}@${VM1_IP:-172.16.0.83}:27017/graylog?authSource=admin
    volumes:
      - graylog_data:/usr/share/graylog/data
    ports:
      - "9000:9000"
      - "12201:12201/udp"
      - "5044:5044"
    networks:
      - siem-network
    depends_on:
      - graylog-opensearch

  # ==========================================================================
  # MISP STACK
  # ==========================================================================
  misp-redis:
    image: redis:7
    container_name: misp-redis
    hostname: misp-redis
    restart: unless-stopped
    command: redis-server --requirepass ${MISP_REDIS_PASSWORD:-redispassword}
    volumes:
      - misp_redis_data:/data
    networks:
      - siem-network

  misp-db:
    image: mariadb:10.11
    container_name: misp-db
    hostname: misp-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MISP_MYSQL_ROOT_PASSWORD:-mispdbroot}
      - MYSQL_DATABASE=misp
      - MYSQL_USER=misp
      - MYSQL_PASSWORD=${MISP_MYSQL_PASSWORD:-mispdbpassword}
    volumes:
      - misp_db_data:/var/lib/mysql
    networks:
      - siem-network

  misp-core:
    image: ghcr.io/misp/misp-docker/misp-core:latest
    container_name: misp-core
    hostname: misp-core
    restart: unless-stopped
    environment:
      - BASE_URL=https://${VM2_IP:-172.16.0.53}:8443
      - REDIS_HOST=misp-redis
      - REDIS_PASSWORD=${MISP_REDIS_PASSWORD:-redispassword}
      - MYSQL_HOST=misp-db
      - MYSQL_DATABASE=misp
      - MYSQL_USER=misp
      - MYSQL_PASSWORD=${MISP_MYSQL_PASSWORD:-mispdbpassword}
      - ADMIN_EMAIL=${MISP_ADMIN_EMAIL:-admin@siem.local}
      - ADMIN_PASSWORD=${MISP_ADMIN_PASSWORD:-MispAdmin123!}
      - SECURITY_SALT=${MISP_SECURITY_SALT:-randomsalt1234567890}
    volumes:
      - misp_data:/var/www/MISP
      - misp_config:/var/www/MISP/app/Config
      - misp_logs:/var/www/MISP/app/tmp/logs
    ports:
      - "8443:443"
      - "8080:80"
    networks:
      - siem-network
    depends_on:
      - misp-db
      - misp-redis

  misp-modules:
    image: ghcr.io/misp/misp-docker/misp-modules:latest
    container_name: misp-modules
    hostname: misp-modules
    restart: unless-stopped
    environment:
      - REDIS_HOST=misp-redis
      - REDIS_PASSWORD=${MISP_REDIS_PASSWORD:-redispassword}
    networks:
      - siem-network
    depends_on:
      - misp-redis

  # ==========================================================================
  # SHUFFLE SOAR
  # ==========================================================================
  shuffle-backend:
    image: ghcr.io/shuffle/shuffle-backend:latest
    container_name: shuffle-backend
    hostname: shuffle-backend
    restart: unless-stopped
    environment:
      - SHUFFLE_APP_HOTLOAD_FOLDER=/shuffle-apps
      - SHUFFLE_FILE_LOCATION=/shuffle-files
      - SHUFFLE_OPENSEARCH_URL=http://shuffle-opensearch:9200
    volumes:
      - shuffle_apps:/shuffle-apps
      - shuffle_files:/shuffle-files
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "5001:5001"
    networks:
      - siem-network

  shuffle-frontend:
    image: ghcr.io/shuffle/shuffle-frontend:latest
    container_name: shuffle-frontend
    hostname: shuffle-frontend
    restart: unless-stopped
    environment:
      - BACKEND_HOSTNAME=shuffle-backend
    ports:
      - "3001:80"
      - "3443:443"
    networks:
      - siem-network
    depends_on:
      - shuffle-backend

  shuffle-opensearch:
    image: opensearchproject/opensearch:2.14.0
    container_name: shuffle-opensearch
    hostname: shuffle-opensearch
    restart: unless-stopped
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - "bootstrap.memory_lock=true"
      - "discovery.type=single-node"
      - "plugins.security.disabled=true"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - shuffle_opensearch_data:/usr/share/opensearch/data
    networks:
      - siem-network

volumes:
  # Wazuh volumes
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh_dashboard_config:
  wazuh_dashboard_custom:
  # Graylog volumes
  graylog_opensearch_data:
  graylog_data:
  # MISP volumes
  misp_redis_data:
  misp_db_data:
  misp_data:
  misp_config:
  misp_logs:
  # Shuffle volumes
  shuffle_apps:
  shuffle_files:
  shuffle_opensearch_data:

networks:
  siem-network:
    driver: bridge
    name: siem-network
