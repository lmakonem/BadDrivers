---
# 6-monitoring.yml - Monitoring and Observability Setup
# Tasks: Prometheus, Filebeat, Grafana, log aggregation

- name: "Install Prometheus"
  block:
    - name: "Create prometheus user"
      user:
        name: prometheus
        shell: /bin/false
        create_home: no
        home: /nonexistent

    - name: "Create Prometheus directories"
      file:
        path: "{{ item }}"
        state: directory
        owner: prometheus
        group: prometheus
        mode: '0755'
      loop:
        - /etc/prometheus
        - /var/lib/prometheus
        - /var/log/prometheus

    - name: "Download and install Prometheus"
      shell: |
        cd /tmp
        wget -q https://github.com/prometheus/prometheus/releases/download/v2.45.0/prometheus-2.45.0.linux-amd64.tar.gz
        tar xzf prometheus-2.45.0.linux-amd64.tar.gz
        cp prometheus-2.45.0.linux-amd64/prometheus /usr/local/bin/
        cp prometheus-2.45.0.linux-amd64/promtool /usr/local/bin/
        cp -r prometheus-2.45.0.linux-amd64/consoles /etc/prometheus/
        cp -r prometheus-2.45.0.linux-amd64/console_libraries /etc/prometheus/
        chown -R prometheus:prometheus /etc/prometheus
        chown -R prometheus:prometheus /var/lib/prometheus
      args:
        creates: /usr/local/bin/prometheus

    - name: "Create Prometheus configuration"
      template:
        src: prometheus.yml.j2
        dest: /etc/prometheus/prometheus.yml
        owner: prometheus
        group: prometheus
        mode: '0640'
      notify: restart prometheus

    - name: "Create Prometheus systemd service"
      copy:
        dest: /etc/systemd/system/prometheus.service
        content: |
          [Unit]
          Description=Prometheus
          Wants=network-online.target
          After=network-online.target

          [Service]
          User=prometheus
          Group=prometheus
          Type=simple
          ExecStart=/usr/local/bin/prometheus \
            --config.file=/etc/prometheus/prometheus.yml \
            --storage.tsdb.path=/var/lib/prometheus \
            --web.enable-lifecycle

          SyslogIdentifier=prometheus
          Restart=always
          RestartSec=5s

          [Install]
          WantedBy=multi-user.target
        mode: '0644'
      notify: reload systemd

    - name: "Enable Prometheus service"
      systemd:
        name: prometheus
        state: started
        enabled: yes
        daemon_reload: yes

  when: "'mythic_servers' in group_names"

- name: "Install Node Exporter"
  block:
    - name: "Create node_exporter user"
      user:
        name: node_exporter
        shell: /bin/false
        create_home: no

    - name: "Download and install Node Exporter"
      shell: |
        cd /tmp
        wget -q https://github.com/prometheus/node_exporter/releases/download/v1.6.1/node_exporter-1.6.1.linux-amd64.tar.gz
        tar xzf node_exporter-1.6.1.linux-amd64.tar.gz
        cp node_exporter-1.6.1.linux-amd64/node_exporter /usr/local/bin/
        chown node_exporter:node_exporter /usr/local/bin/node_exporter
      args:
        creates: /usr/local/bin/node_exporter

    - name: "Create Node Exporter systemd service"
      copy:
        dest: /etc/systemd/system/node-exporter.service
        content: |
          [Unit]
          Description=Node Exporter
          After=network-online.target

          [Service]
          User=node_exporter
          Group=node_exporter
          Type=simple
          ExecStart=/usr/local/bin/node_exporter \
            --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)

          Restart=always
          RestartSec=5s

          [Install]
          WantedBy=multi-user.target
        mode: '0644'
      notify: reload systemd

    - name: "Enable Node Exporter service"
      systemd:
        name: node-exporter
        state: started
        enabled: yes
        daemon_reload: yes

  when: "('mythic_servers' in group_names or 'redirectors' in group_names)"

- name: "Install Filebeat for log forwarding"
  block:
    - name: "Add Elastic GPG key"
      apt_key:
        url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
        state: present

    - name: "Add Elastic repository"
      apt_repository:
        repo: "deb https://artifacts.elastic.co/packages/8.x/apt stable main"
        state: present
        filename: elastic-8.x

    - name: "Install Filebeat"
      apt:
        name: filebeat
        state: present
        update_cache: yes

    - name: "Create Filebeat configuration"
      template:
        src: filebeat.yml.j2
        dest: /etc/filebeat/filebeat.yml
        owner: root
        group: root
        mode: '0600'
      notify: restart filebeat

    - name: "Enable Filebeat service"
      systemd:
        name: filebeat
        state: started
        enabled: yes
        daemon_reload: yes

  when: filebeat_enabled

- name: "Install Grafana (Mythic servers only)"
  block:
    - name: "Add Grafana GPG key"
      apt_key:
        url: https://apt.grafana.com/gpg.key
        state: present

    - name: "Add Grafana repository"
      apt_repository:
        repo: "deb https://apt.grafana.com stable main"
        state: present
        filename: grafana

    - name: "Install Grafana"
      apt:
        name: grafana-server
        state: present
        update_cache: yes

    - name: "Create Grafana provisioning directories"
      file:
        path: "{{ item }}"
        state: directory
        owner: grafana
        group: grafana
        mode: '0755'
      loop:
        - /etc/grafana/provisioning/dashboards
        - /etc/grafana/provisioning/datasources

    - name: "Create Grafana datasource (Prometheus)"
      copy:
        dest: /etc/grafana/provisioning/datasources/prometheus.yml
        content: |
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              access: proxy
              url: http://localhost:9090
              jsonData:
                timeInterval: 15s
              isDefault: true
        owner: grafana
        group: grafana
        mode: '0644'
      notify: restart grafana

    - name: "Create Grafana dashboard provisioning config"
      copy:
        dest: /etc/grafana/provisioning/dashboards/mythic.yml
        content: |
          apiVersion: 1
          providers:
            - name: 'Mythic Dashboards'
              orgId: 1
              folder: 'Mythic'
              type: file
              disableDeletion: false
              updateIntervalSeconds: 10
              allowUiUpdates: true
              options:
                path: /var/lib/grafana/dashboards
        owner: grafana
        group: grafana
        mode: '0644'
      notify: restart grafana

    - name: "Enable Grafana service"
      systemd:
        name: grafana-server
        state: started
        enabled: yes
        daemon_reload: yes

  when: "'mythic_servers' in group_names"

- name: "Create monitoring dashboards and alerts"
  block:
    - name: "Create alert rules file"
      template:
        src: prometheus-alerts.yml.j2
        dest: /etc/prometheus/alerts.yml
        owner: prometheus
        group: prometheus
        mode: '0640'
      notify: restart prometheus

    - name: "Create Prometheus recording rules"
      template:
        src: prometheus-rules.yml.j2
        dest: /etc/prometheus/rules.yml
        owner: prometheus
        group: prometheus
        mode: '0640'
      notify: restart prometheus

  when: "'mythic_servers' in group_names"

- name: "Configure log collection"
  block:
    - name: "Create log collection directory"
      file:
        path: /var/log/mythic
        state: directory
        mode: '0755'

    - name: "Create log rotation config"
      copy:
        dest: /etc/logrotate.d/mythic-monitoring
        content: |
          /var/log/mythic/*.log {
            daily
            missingok
            rotate 30
            compress
            delaycompress
            notifempty
            create 0640 root adm
            sharedscripts
            postrotate
              systemctl reload rsyslog > /dev/null 2>&1 || true
            endscript
          }
        mode: '0644'

  when: "'mythic_servers' in group_names"

- name: "Create custom metrics collection scripts"
  block:
    - name: "Create container metrics collector"
      copy:
        dest: /opt/scripts/collect-container-metrics.sh
        content: |
          #!/bin/bash
          # Collect Docker container metrics
          echo "# HELP container_memory_usage Memory usage in bytes"
          echo "# TYPE container_memory_usage gauge"
          docker stats --no-stream --format json | jq -r '.[] | "container_memory_usage{name=\"\(.Names)\"} \(.MemUsage | split(\"/\")[0])"'

          echo "# HELP container_cpu_percent CPU usage percentage"
          echo "# TYPE container_cpu_percent gauge"
          docker stats --no-stream --format json | jq -r '.[] | "container_cpu_percent{name=\"\(.Names)\"} \(.CPUPerc | gsub(\"%\"; \"\"))"'
        mode: '0755'

    - name: "Create Mythic API health check script"
      copy:
        dest: /opt/scripts/check-mythic-health.sh
        content: |
          #!/bin/bash
          # Check Mythic API health
          MYTHIC_URL="https://localhost:{{ mythic_https_port }}/api/health"

          curl -s -k "$MYTHIC_URL" | jq -r '.status' | grep -q "ok"
          if [ $? -eq 0 ]; then
            echo "Mythic API is healthy"
            exit 0
          else
            echo "Mythic API is unhealthy"
            exit 1
          fi
        mode: '0755'

  when: "'mythic_servers' in group_names"

- name: "Monitoring setup phase complete"
  debug:
    msg: |
      Monitoring setup complete
      Prometheus: http://localhost:9090
      Grafana: http://localhost:3000 (if enabled)
      Node Exporter: http://localhost:9100/metrics
