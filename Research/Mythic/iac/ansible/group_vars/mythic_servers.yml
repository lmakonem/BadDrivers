---
# Mythic Server Group Variables
mythic_container_port: 7681
mythic_webhook_port: 8000
mythic_https_port: 7443
mythic_base_path: /opt/mythic
mythic_user: mythic
mythic_group: mythic
mythic_docker_compose_version: "3.8"

# Database
postgres_version: "13"
postgres_user: mythic_user
postgres_password: "{{ vault_mythic_db_password }}"
postgres_db: mythic
postgres_port: 5432

# Docker Images
docker_images:
  - name: docker.io/itsafeature/mythic_postgres:{{ mythic_version }}
  - name: docker.io/itsafeature/mythic_mythic:{{ mythic_version }}
  - name: docker.io/itsafeature/mythic_grafana:latest
  - name: docker.io/itsafeature/mythic_rabbitmq:latest
  - name: nginx:latest
  - name: socat:latest

# UFW Rules
ufw_rules_mythic:
  - port: 22
    proto: tcp
    rule: allow
    comment: "SSH"
  - port: 7443
    proto: tcp
    rule: allow
    comment: "Mythic HTTPS"
  - port: 7681
    proto: tcp
    rule: allow
    comment: "Mythic API"
  - port: 8000
    proto: tcp
    rule: allow
    comment: "Mythic Webhook"
  - port: 5432
    proto: tcp
    rule: allow
    from_ip: "10.23.20.0/24"
    comment: "PostgreSQL (internal)"

# Fail2ban
fail2ban_enabled: true
fail2ban_bantime: 3600
fail2ban_findtime: 600
fail2ban_maxretry: 5
fail2ban_ssh_enabled: true

# Auditd Rules
auditd_enabled: true
auditd_rules:
  - "-w /opt/mythic/payloads -p wa -k mythic_payload_change"
  - "-w /opt/mythic/config -p wa -k mythic_config_change"
  - "-w /etc/docker -p wa -k docker_config_change"
  - "-a always,exit -F arch=b64 -S execve -F path=/opt/mythic -F auid>=1000 -k mythic_execution"

# SSH Hardening
ssh_port: 22
ssh_permit_root_login: "no"
ssh_password_authentication: "no"
ssh_pubkey_authentication: "yes"
ssh_permit_empty_password: "no"
ssh_x11_forwarding: "no"
ssh_max_auth_tries: 3

# Monitoring
prometheus_scrape_interval: 15s
prometheus_evaluation_interval: 15s
filebeat_enabled: true
filebeat_log_paths:
  - /var/log/auth.log
  - /var/log/syslog
  - /opt/mythic/docker.log

# TLS Certificates
tls_cert_path: /etc/ssl/certs/mythic.crt
tls_key_path: /etc/ssl/private/mythic.key
tls_cert_validity_days: 365

# Backup
backup_enabled: true
backup_retention_days: 14
backup_schedule: "0 2 * * *"  # Daily at 2 AM

# Feature Flags
enable_monitoring: true
enable_backup: true
enable_ha_replication: "{{ 'yes' if deployment_mode == 'ops' else 'no' }}"
enable_vault_integration: "{{ 'yes' if deployment_mode == 'ops' else 'no' }}"
