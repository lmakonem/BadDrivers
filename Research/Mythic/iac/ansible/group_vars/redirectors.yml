---
# Redirector Group Variables
redirector_listen_port: 443
redirector_backend_host: 10.23.20.10
redirector_backend_port: 7443
redirector_backend_timeout: 30
redirector_max_connections: 1000

# Nginx Configuration
nginx_enabled: true
nginx_worker_processes: auto
nginx_worker_connections: 2048
nginx_keepalive_timeout: 65
nginx_gzip: "on"
nginx_gzip_comp_level: 6

# Socat (TCP/UDP Relay)
socat_enabled: true
socat_rules:
  - listen_port: 53
    backend_host: 10.23.20.10
    backend_port: 53
    protocol: udp
    comment: "DNS relay"
  - listen_port: 8080
    backend_host: 10.23.20.10
    backend_port: 8000
    protocol: tcp
    comment: "HTTP callback relay"

# Dnsmasq Configuration
dnsmasq_enabled: true
dnsmasq_listen_address: 0.0.0.0
dnsmasq_port: 53
dnsmasq_cache_size: 512
dnsmasq_log_queries: true
dnsmasq_log_facility: /var/log/dnsmasq.log

# DNS Records (for C2 domain spoofing)
dns_records:
  - domain: "underdvr.exe"
    ip: "192.168.36.100"
  - domain: "api.underdvr.exe"
    ip: "192.168.36.100"
  - domain: "beacon.lockbit.local"
    ip: "192.168.36.100"

# UFW Rules for Redirector
ufw_rules_redirector:
  - port: 22
    proto: tcp
    rule: allow
    comment: "SSH"
  - port: 53
    proto: udp
    rule: allow
    comment: "DNS"
  - port: 80
    proto: tcp
    rule: allow
    comment: "HTTP"
  - port: 443
    proto: tcp
    rule: allow
    comment: "HTTPS"
  - port: 8080
    proto: tcp
    rule: allow
    comment: "HTTP Callback"

# TLS/SSL Configuration
tls_cert_path: /etc/ssl/certs/redirector.crt
tls_key_path: /etc/ssl/private/redirector.key
tls_chain_path: /etc/ssl/certs/redirector_chain.crt
tls_cert_validity_days: 365

# Monitoring
filebeat_enabled: true
filebeat_log_paths:
  - /var/log/nginx/access.log
  - /var/log/nginx/error.log
  - /var/log/dnsmasq.log
  - /var/log/syslog

prometheus_node_exporter_enabled: true
prometheus_node_exporter_port: 9100

# Network Configuration
ipv4_forwarding: false
ipv6_forwarding: false
rp_filter: 1  # Reverse path filtering

# Fail2ban
fail2ban_enabled: true
fail2ban_bantime: 3600
fail2ban_findtime: 600
fail2ban_maxretry: 5

# SSH Hardening
ssh_port: 22
ssh_permit_root_login: "no"
ssh_password_authentication: "no"
ssh_pubkey_authentication: "yes"
ssh_permit_empty_password: "no"
ssh_x11_forwarding: "no"

# HA Configuration (ops mode only)
keepalived_enabled: "{{ 'yes' if deployment_mode == 'ops' else 'no' }}"
keepalived_virtual_ip: "192.168.36.200"
keepalived_priority: 100
keepalived_vrid: 51
