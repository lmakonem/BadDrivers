---
# Echidna Smart Contract Fuzzer Configuration
echidna_workspace: /var/echidna
echidna_version: "0.8.0"
echidna_enable: true

# Fuzzing parameters
test_limit: 50000
timeout: 30
workers: 4
seed: 1337

# Solidity compiler version
solc_version: "0.8.0"

# Sample contract paths
sample_contracts:
  - path: "{{ echidna_workspace }}/contracts"
    description: "Smart contracts for fuzzing"
