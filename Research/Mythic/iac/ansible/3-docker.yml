---
# 3-docker.yml - Docker Setup Phase
# Tasks: Install Docker, pull images, configure systemd

- name: "Install Docker repository GPG key"
  apt_key:
    url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
    state: present

- name: "Add Docker repository"
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
    state: present
    filename: docker-ce

- name: "Install Docker and dependencies"
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: "Create docker group"
  group:
    name: docker
    state: present

- name: "Add deployment user to docker group"
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes

- name: "Create docker daemon configuration directory"
  file:
    path: /etc/docker
    state: directory
    mode: '0755'

- name: "Configure Docker daemon (security hardening)"
  copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "5",
          "labels": "service=mythic"
        },
        "storage-driver": "overlay2",
        "icc": false,
        "default-ulimits": {
          "nofile": {
            "Name": "nofile",
            "Hard": 4096,
            "Soft": 4096
          },
          "nproc": {
            "Name": "nproc",
            "Hard": 4096,
            "Soft": 4096
          }
        },
        "seccomp-profile": "/etc/docker/seccomp.json",
        "live-restore": true,
        "userland-proxy": false,
        "default-runtime": "runc",
        "runtimes": {
          "runc": {
            "path": "runc",
            "runtimeArgs": []
          }
        },
        "security-opt": [
          "apparmor=docker-default"
        ]
      }
    mode: '0644'
  notify: restart docker

