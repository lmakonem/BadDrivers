- name: "Create systemd docker service directory"
  file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: '0755'

- name: "Configure Docker systemd service (resource limits)"
  copy:
    dest: /etc/systemd/system/docker.service.d/limits.conf
    content: |
      [Service]
      # Restart policy
      Restart=always
      RestartSec=5s

      # Resource limits
      MemoryLimit=4G
      MemoryReservation=2G
      CPUQuota=200%

      # Logging
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=docker

      # Security
      ProtectSystem=strict
      ProtectHome=yes
      NoNewPrivileges=true
      PrivateTmp=yes
      ProtectKernelTunables=yes
      ProtectKernelModules=yes
      ProtectControlGroups=yes
      RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
      RestrictNamespaces=yes
      LockPersonality=yes
      MemoryDenyWriteExecute=yes
      RestrictRealtime=yes
      RestrictSUIDSGID=yes
      UMask=0077
    mode: '0644'
  notify: restart docker

- name: "Enable Docker service"
  systemd:
    name: docker
    state: started
    enabled: yes
    daemon_reload: yes

- name: "Wait for Docker daemon to be ready"
  shell: "docker ps"
  register: docker_ready
  until: docker_ready.rc == 0
  retries: 10
  delay: 5

- name: "Pull Docker base images"
  docker_image:
    name: "{{ item }}"
    source: pull
  loop: "{{ docker_images }}"
  ignore_errors: yes
  async: 3600
  poll: 0
  register: image_pulls

- name: "Wait for Docker image pulls to complete"
  async_status:
    jid: "{{ item.ansible_job_id }}"
  register: image_pull_results
  until: image_pull_results.finished
  retries: 120
  delay: 10
  loop: "{{ image_pulls.results }}"
  when: item.ansible_job_id is defined

- name: "Create Docker network for Mythic"
  docker_network:
    name: mythic-net
    state: present
    driver: bridge
    driver_options:
      com.docker.network.bridge.enable_icc: "false"
  when: "'mythic_servers' in group_names"

- name: "Create Docker volumes for persistence"
  docker_volume:
    name: "{{ item }}"
    state: present
  loop:
    - mythic-postgres-data
    - mythic-rabbitmq-data
    - mythic-logs
  when: "'mythic_servers' in group_names"

- name: "Docker setup phase complete"
  debug:
    msg: "Docker setup phase completed successfully"
