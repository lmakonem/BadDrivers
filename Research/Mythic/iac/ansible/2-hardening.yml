---
# 2-hardening.yml - Security Hardening Phase
# Tasks: UFW, fail2ban, auditd, SSH hardening, kernel hardening

- name: "Initialize UFW (disable and reset)"
  shell: |
    ufw --force disable
    ufw --force reset
  changed_when: true

- name: "Configure UFW defaults"
  ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - direction: incoming
      policy: deny
    - direction: outgoing
      policy: allow
    - direction: routed
      policy: deny

- name: "Configure UFW rules for all hosts"
  ufw:
    rule: "{{ item.rule }}"
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment }}"
  loop:
    - rule: allow
      port: "22"
      proto: tcp
      comment: "SSH access"
    - rule: allow
      port: "{{ ansible_port | default('22') }}"
      proto: tcp
      comment: "Ansible SSH"
  when: item.port is defined

- name: "Configure UFW rules for Mythic servers"
  ufw:
    rule: "{{ item.rule }}"
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    from_ip: "{{ item.from_ip | default('0.0.0.0/0') }}"
    comment: "{{ item.comment }}"
  loop: "{{ ufw_rules_mythic }}"
  when: "'mythic_servers' in group_names"

- name: "Configure UFW rules for redirectors"
  ufw:
    rule: "{{ item.rule }}"
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment }}"
  loop: "{{ ufw_rules_redirector }}"
  when: "'redirectors' in group_names"

- name: "Enable UFW"
  ufw:
    state: enabled
  notify: restart ufw

- name: "Configure fail2ban jail defaults"
  copy:
    dest: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      bantime = {{ fail2ban_bantime }}
      findtime = {{ fail2ban_findtime }}
      maxretry = {{ fail2ban_maxretry }}
      destemail = {{ fail2ban_email | default('root@localhost') }}
      sendername = Fail2Ban
      action = %(action_mwl)s

      [sshd]
      enabled = true
      maxretry = {{ fail2ban_maxretry }}
      bantime = {{ fail2ban_bantime }}

      [sshd-ddos]
      enabled = true
      port = ssh
      logpath = %(sshd_log)s
      maxretry = 10
      bantime = 600

  notify: restart fail2ban

- name: "Enable and start fail2ban"
  systemd:
    name: fail2ban
    state: started
    enabled: yes
    daemon_reload: yes

- name: "Configure auditd rules"
  template:
    src: audit.rules.j2
    dest: /etc/audit/rules.d/mythic.rules
    mode: '0640'
  notify: restart auditd

- name: "Enable and start auditd"
  systemd:
    name: auditd
    state: started
    enabled: yes
    daemon_reload: yes

- name: "Configure system audit logging"
  copy:
    dest: /etc/audit/rules.d/system.rules
    content: |
      # Audit kernel module changes
      -w /sbin/insmod -p x -k modules
      -w /sbin/rmmod -p x -k modules
      -w /sbin/modprobe -p x -k modules
      -a always,exit -F arch=b64 -S init_module -S delete_module -k modules

      # Audit system calls (64-bit)
      -a always,exit -F arch=b64 -S adjtimex -S settimeofday -k time-change
      -a always,exit -F arch=b64 -S clock_settime -k time-change
      -a always,exit -F arch=b64 -S sethostname -S setdomainname -k network_modifications
      -a always,exit -F arch=b64 -S sethostname -S setdomainname -k network_modifications
      -w /etc/issue -p wa -k system_locale
      -w /etc/issue.net -p wa -k system_locale
      -w /etc/hosts -p wa -k network_modifications
      -w /etc/network -p wa -k network_modifications
      -w /etc/sysconfig/network -p wa -k network_modifications
      -w /etc/sysconfig/network-scripts/ -p wa -k network_modifications

      # Monitor sudoers usage
      -w /etc/sudoers -p wa -k sudoers
      -w /etc/sudoers.d/ -p wa -k sudoers

      # Monitor user/group tools
      -w /usr/sbin/usermod -p x -k usermod
      -w /usr/sbin/passwd -p x -k passwd_modification
      -w /usr/sbin/groupadd -p x -k group_modification
      -w /usr/sbin/groupmod -p x -k group_modification
      -w /usr/sbin/addgroup -p x -k group_modification
      -w /usr/sbin/useradd -p x -k user_modification
      -w /usr/sbin/adduser -p x -k user_modification
      -w /usr/sbin/userdel -p x -k user_modification
      -w /usr/sbin/usermod -p x -k user_modification

      # Monitor login/logout events
      -w /var/log/faillog -p wa -k logins
      -w /var/log/lastlog -p wa -k logins
      -w /var/log/tallylog -p wa -k logins

      # Monitor session initiation
      -w /var/run/utmp -p wa -k session
      -w /var/log/wtmp -p wa -k logins
      -w /var/log/btmp -p wa -k logins

      # Make configuration immutable
      -e 2
    mode: '0640'
  notify: restart auditd

- name: "Configure apparmor for additional security"
  shell: |
    systemctl is-active --quiet apparmor || systemctl start apparmor
    systemctl enable apparmor
  changed_when: false

- name: "Harden SSH daemon configuration"
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?{{ item.key }}"
    line: "{{ item.key }} {{ item.value }}"
    state: present
  loop:
    - key: "PermitRootLogin"
      value: "no"
    - key: "PasswordAuthentication"
      value: "no"
    - key: "PubkeyAuthentication"
      value: "yes"
    - key: "PermitEmptyPasswords"
      value: "no"
    - key: "X11Forwarding"
      value: "no"
    - key: "MaxAuthTries"
      value: "{{ ssh_max_auth_tries }}"
    - key: "ClientAliveInterval"
      value: "300"
    - key: "ClientAliveCountMax"
      value: "0"
    - key: "AllowUsers"
      value: "localuser deployuser"
    - key: "Protocol"
      value: "2"
    - key: "LogLevel"
      value: "VERBOSE"
  notify: restart sshd

- name: "Configure SSH moduli for security"
  shell: |
    ssh-keygen -G /tmp/moduli.all -b 3072
    ssh-keygen -T /etc/ssh/moduli -f /tmp/moduli.all
    rm /tmp/moduli.all
  changed_when: false
  ignore_errors: yes
  when: "'mythic_servers' in group_names"

- name: "Set restrictive SSH config permissions"
  file:
    path: /etc/ssh/sshd_config
    mode: '0600'
    owner: root
    group: root

- name: "Restrict file permissions for sensitive files"
  file:
    path: "{{ item }}"
    mode: '0600'
    owner: root
    group: root
  loop:
    - /etc/shadow
    - /etc/gshadow
    - /root/.ssh
    - /root/.ssh/authorized_keys
    - /root/.bash_history
  ignore_errors: yes

- name: "Disable unnecessary services"
  systemd:
    name: "{{ item }}"
    state: stopped
    enabled: no
    daemon_reload: yes
  loop:
    - avahi-daemon
    - cups
    - isc-dhcp-server
    - isc-dhcp-server6
    - slapd
    - nfs-server
    - bind9
    - vsftpd
    - apache2
    - dovecot
    - snmpd
  failed_when: false

- name: "Disable unnecessary kernel modules"
  copy:
    dest: /etc/modprobe.d/disable-uncommon-modules.conf
    content: |
      # Disable uncommon filesystems
      install cramfs /bin/true
      install freevxfs /bin/true
      install jffs2 /bin/true
      install hfs /bin/true
      install hfsplus /bin/true
      install udf /bin/true

      # Disable uncommon network protocols
      install dccp /bin/true
      install sctp /bin/true
      install rds /bin/true
      install tipc /bin/true

      # Disable USB storage
      install usb-storage /bin/true
    mode: '0644'

- name: "Configure core dump restrictions"
  lineinfile:
    path: /etc/security/limits.conf
    line: "* soft core 0"
    insertbefore: "^# End of file"

- name: "Harden permissions on boot files"
  file:
    path: "{{ item }}"
    mode: '0600'
    owner: root
    group: root
  loop:
    - /boot/grub/grub.cfg
    - /boot/grub2/grub.cfg
  failed_when: false

- name: "Hardening phase complete"
  debug:
    msg: "Hardening phase completed successfully"
