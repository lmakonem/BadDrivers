---
# Verify Role - Main Tasks (Integration Tests)
- name: "Test DNS resolution"
  command: "nslookup {{ ansible_fqdn }} 8.8.8.8"
  register: dns_test
  changed_when: false

- name: "Test TLS certificate"
  stat:
    path: "{{ tls_cert_path | default('/etc/ssl/certs/server.crt') }}"
  register: cert_stat

- name: "Verify certificate validity"
  openssl_certificate_info:
    path: "{{ cert_stat.stat.path }}"
  register: cert_info
  when: cert_stat.stat.exists

- name: "Test firewall (UFW)"
  shell: "ufw status | grep -q 'Status: active'"
  register: ufw_test
  changed_when: false

- name: "Test SSH hardening"
  shell: |
    grep -q 'PasswordAuthentication no' /etc/ssh/sshd_config && \
    grep -q 'PermitRootLogin no' /etc/ssh/sshd_config && \
    grep -q 'PubkeyAuthentication yes' /etc/ssh/sshd_config
  register: ssh_test
  changed_when: false

- name: "Test auditd"
  systemd:
    name: auditd
  register: auditd_test

- name: "Generate test results"
  debug:
    msg: |
      ========================================
      Integration Test Results
      ========================================
      DNS Resolution: {% if dns_test.rc == 0 %}PASS{% else %}FAIL{% endif %}
      TLS Certificate: {% if cert_stat.stat.exists %}PASS{% else %}FAIL{% endif %}
      Firewall (UFW): {% if ufw_test.rc == 0 %}PASS{% else %}FAIL{% endif %}
      SSH Hardening: {% if ssh_test.rc == 0 %}PASS{% else %}FAIL{% endif %}
      Auditd: {% if auditd_test.status.ActiveState == 'active' %}PASS{% else %}FAIL{% endif %}
      ========================================

- name: "Verify role complete"
  debug:
    msg: "Verify role tasks completed"
