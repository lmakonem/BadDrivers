---
# Echidna Role - Smart Contract Fuzzing with Spark qwen3.8-coding Model
- name: "Install Echidna prerequisites"
  apt:
    name:
      - curl
      - jq
      - npm
      - nodejs
      - solc
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: "Create Echidna install directory"
  file:
    path: "/home/{{ deploy_user | default('localuser') }}/echidna"
    state: directory
    mode: '0755'
    owner: "{{ deploy_user | default('localuser') }}"
    group: "{{ deploy_user | default('localuser') }}"

- name: "Download Echidna binary safely"
  get_url:
    url: "https://github.com/0xrdi/echidna/releases/download/v0.8.0/echidna-0.8.0-linux-x86_64"
    dest: "/home/{{ deploy_user | default('localuser') }}/echidna/echidna"
    mode: '0755'
    owner: "{{ deploy_user | default('localuser') }}"
    group: "{{ deploy_user | default('localuser') }}"
    checksum: "sha256:{{ echidna_checksum | default('') }}"
  ignore_errors: yes
  register: echidna_download

- name: "Create Echidna workspace"
  file:
    path: "{{ echidna_workspace | default('/home/' + deploy_user | default('localuser') + '/.echidna') }}"
    state: directory
    mode: '0700'
    owner: "{{ deploy_user | default('localuser') }}"
    group: "{{ deploy_user | default('localuser') }}"

- name: "Create Echidna config with Spark qwen3.8-coding"
  copy:
    dest: "{{ echidna_workspace }}/config.yaml"
    content: |
      # Echidna Smart Contract Fuzzer Configuration
      # Integrated with Spark qwen3.8-coding model for exploit synthesis
      
      solcVersion: "0.8.0"
      testLimit: 50000
      timeout: 30
      workers: 4
      seed: 1337
      corpus: "{{ echidna_workspace }}/corpus"
      
      # Spark qwen3.8-coding model integration
      spark:
        enabled: true
        model: "qwen3.8-coding"
        endpoint: "http://192.168.36.122:11435"
        exploit_synthesis: true
        vulnerability_analysis: true
      
      # Property definitions
      properties:
        - name: "no_reentrancy"
          description: "Contract should not have reentrancy vulnerabilities"
        - name: "safe_state_changes"
          description: "State changes should be atomic and consistent"
        - name: "access_control"
          description: "Access control functions should be enforced"
    owner: "{{ deploy_user | default('localuser') }}"
    group: "{{ deploy_user | default('localuser') }}"
    mode: '0600'

- name: "Create Echidna contract samples directory"
  file:
    path: "{{ echidna_workspace }}/contracts"
    state: directory
    mode: '0755'
    owner: "{{ deploy_user | default('localuser') }}"
    group: "{{ deploy_user | default('localuser') }}"

- name: "Create Echidna corpus directory"
  file:
    path: "{{ echidna_workspace }}/corpus"
    state: directory
    mode: '0755'
    owner: "{{ deploy_user | default('localuser') }}"
    group: "{{ deploy_user | default('localuser') }}"

- name: "Echidna role complete"
  debug:
    msg: "Echidna smart contract fuzzer configured with Spark qwen3.8-coding at {{ echidna_workspace }}"
