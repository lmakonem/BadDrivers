---
# Bootstrap Role - Main Tasks
- name: "Install essential packages"
  apt:
    name:
      - curl
      - wget
      - git
      - python3-pip
      - openssh-client
      - openssh-server
      - sudo
      - ca-certificates
      - gnupg
      - unzip
      - jq
      - net-tools
    state: present
  register: pkg_install
  retries: 3
  delay: 10

- name: "Create deployment user"
  user:
    name: "{{ deploy_user }}"
    shell: /bin/bash
    groups: sudo,adm
    append: yes
    create_home: yes

- name: "Create SSH directory for deployment user"
  file:
    path: "/home/{{ deploy_user }}/.ssh"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: '0700'

- name: "Configure sudo access"
  lineinfile:
    path: "/etc/sudoers.d/{{ deploy_user }}"
    line: "{{ deploy_user }} ALL=(ALL) NOPASSWD: ALL"
    create: yes
    mode: '0440'
    validate: '/usr/sbin/visudo -cf %s'

- name: "Set hostname"
  hostname:
    name: "{{ inventory_hostname }}"
    use: systemd

- name: "Configure system timezone"
  timezone:
    name: "{{ timezone | default('UTC') }}"

- name: "Set system-wide environment variables"
  copy:
    dest: /etc/environment
    content: |
      PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      DEPLOY_MODE="{{ deployment_mode }}"
      PYTHONUNBUFFERED=1
    mode: '0644'

- name: "Bootstrap role complete"
  debug:
    msg: "Bootstrap role tasks completed"
