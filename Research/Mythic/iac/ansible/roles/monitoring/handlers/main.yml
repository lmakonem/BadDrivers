---
# Monitoring Role - Handlers
- name: restart prometheus
  systemd:
    name: prometheus
    state: restarted
    daemon_reload: yes

- name: restart node_exporter
  systemd:
    name: node-exporter
    state: restarted
    daemon_reload: yes

- name: restart filebeat
  systemd:
    name: filebeat
    state: restarted
    daemon_reload: yes
