---
# Hardening Role - Main Tasks
- name: "Configure UFW firewall"
  ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: "Configure fail2ban"
  copy:
    dest: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      bantime = {{ fail2ban_bantime | default(3600) }}
      findtime = {{ fail2ban_findtime | default(600) }}
      maxretry = {{ fail2ban_maxretry | default(5) }}

      [sshd]
      enabled = true
  notify: restart fail2ban

- name: "Enable fail2ban service"
  systemd:
    name: fail2ban
    state: started
    enabled: yes

- name: "Configure auditd"
  service:
    name: auditd
    state: started
    enabled: yes

- name: "Harden SSH configuration"
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?{{ item.key }}"
    line: "{{ item.key }} {{ item.value }}"
  loop:
    - key: "PermitRootLogin"
      value: "no"
    - key: "PasswordAuthentication"
      value: "no"
    - key: "PubkeyAuthentication"
      value: "yes"
    - key: "X11Forwarding"
      value: "no"
    - key: "MaxAuthTries"
      value: "3"
  notify: restart sshd

- name: "Set kernel hardening parameters"
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
  loop:
    - name: "net.ipv4.ip_forward"
      value: "0"
    - name: "net.ipv4.conf.all.send_redirects"
      value: "0"
    - name: "net.ipv4.conf.all.accept_redirects"
      value: "0"

- name: "Hardening role complete"
  debug:
    msg: "Hardening role tasks completed"
