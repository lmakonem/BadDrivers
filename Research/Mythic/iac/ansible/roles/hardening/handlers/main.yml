---
# Hardening Role - Handlers
- name: restart sshd
  systemd:
    name: ssh
    state: restarted
    daemon_reload: yes

- name: restart fail2ban
  systemd:
    name: fail2ban
    state: restarted
    daemon_reload: yes

- name: restart auditd
  systemd:
    name: auditd
    state: restarted
    daemon_reload: yes
