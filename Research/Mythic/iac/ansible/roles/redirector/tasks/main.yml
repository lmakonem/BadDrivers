---
# Redirector Role - Main Tasks
- name: "Install redirector packages"
  apt:
    name:
      - nginx
      - socat
      - dnsmasq
    state: present

- name: "Create redirector user"
  user:
    name: "{{ redirector_user | default('redirector') }}"
    shell: /bin/bash
    create_home: yes

- name: "Configure Nginx"
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/c2-proxy
    mode: '0644'
  notify: restart nginx

- name: "Enable Nginx site"
  file:
    src: /etc/nginx/sites-available/c2-proxy
    dest: /etc/nginx/sites-enabled/c2-proxy
    state: link

- name: "Test Nginx configuration"
  shell: nginx -t
  changed_when: false

- name: "Enable Nginx service"
  systemd:
    name: nginx
    state: started
    enabled: yes

- name: "Configure dnsmasq"
  template:
    src: dnsmasq.conf.j2
    dest: /etc/dnsmasq.conf
    mode: '0644'
  notify: restart dnsmasq

- name: "Create DNS hosts file"
  template:
    src: hosts.j2
    dest: /etc/dnsmasq.hosts
    mode: '0644'
  notify: restart dnsmasq

- name: "Enable dnsmasq service"
  systemd:
    name: dnsmasq
    state: started
    enabled: yes

- name: "Configure socat"
  template:
    src: socat.service.j2
    dest: /etc/systemd/system/socat-relay.service
    mode: '0644'
  notify: restart socat

- name: "Enable socat service"
  systemd:
    name: socat-relay
    state: started
    enabled: yes
    daemon_reload: yes

- name: "Redirector role complete"
  debug:
    msg: "Redirector role tasks completed"
