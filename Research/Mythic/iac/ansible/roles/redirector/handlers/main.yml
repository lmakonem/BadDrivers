---
# Redirector Role - Handlers
- name: restart nginx
  systemd:
    name: nginx
    state: restarted
    daemon_reload: yes

- name: restart dnsmasq
  systemd:
    name: dnsmasq
    state: restarted
    daemon_reload: yes

- name: restart socat
  systemd:
    name: socat-relay
    state: restarted
    daemon_reload: yes
