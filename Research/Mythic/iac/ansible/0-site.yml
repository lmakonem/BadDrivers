---
# 0-site.yml - Mythic IaC Orchestrator Playbook
# This is the main entry point that orchestrates all deployment phases
# Usage: ansible-playbook -i inventory/lab.ini 0-site.yml
#        ansible-playbook -i inventory/production.ini 0-site.yml

- name: "Mythic IaC Site Configuration (Orchestrator)"
  hosts: all
  gather_facts: yes
  vars_files:
    - group_vars/mythic_servers.yml
    - group_vars/redirectors.yml

  pre_tasks:
    - name: "Display deployment configuration"
      debug:
        msg: |
          ========================================
          Mythic IaC Deployment
          ========================================
          Mode: {{ deployment_mode | upper }}
          Hosts: {{ groups['all'] | length }}
          Timestamp: {{ ansible_date_time.iso8601 }}
          ========================================

    - name: "Verify Ansible version"
      assert:
        that:
          - ansible_version.major >= 2
          - ansible_version.minor >= 9
        fail_msg: "Ansible 2.9+ required"


  tasks:
    - name: "Phase 1: Bootstrap (SSH keys, users, sudo)"
      include_tasks: 1-bootstrap.yml
      tags:
        - bootstrap
        - always

    - name: "Phase 2: Hardening (UFW, fail2ban, auditd, SSH hardening)"
      include_tasks: 2-hardening.yml
      tags:
        - hardening
        - security

    - name: "Phase 3: Docker Setup (daemon, images, systemd)"
      include_tasks: 3-docker.yml
      tags:
        - docker
        - containers

    - name: "Phase 4: Services (Mythic, httpx, socat, dnsmasq, nginx)"
      include_tasks: 4-services.yml
      tags:
        - services
        - containers

    - name: "Phase 5: TLS Certificates (self-signed or Let's Encrypt)"
      include_tasks: 5-certs.yml
      tags:
        - certs
        - tls

    - name: "Phase 6: Monitoring (Prometheus, Filebeat, Grafana)"
      include_tasks: 6-monitoring.yml
      tags:
        - monitoring
        - observability
      when: enable_monitoring

    - name: "Phase 7: Verification (integration tests)"
      include_tasks: 7-verify.yml
      tags:
        - verify
        - tests
      when: enable_monitoring

  post_tasks:
    - name: "Display deployment summary"
      debug:
        msg: |
          ========================================
          Deployment Complete
          ========================================
          Status: SUCCESS
          Mode: {{ deployment_mode | upper }}
          Duration: {{ (ansible_date_time.epoch | int - start_time | int) }} seconds
          ========================================
      vars:
        start_time: "{{ ansible_date_time.epoch }}"


  handlers:
    - name: "restart sshd"
      systemd:
        name: ssh
        state: restarted
        daemon_reload: yes

    - name: "restart ufw"
      systemd:
        name: ufw
        state: restarted
        daemon_reload: yes

    - name: "restart fail2ban"
      systemd:
        name: fail2ban
        state: restarted
        daemon_reload: yes

    - name: "restart auditd"
      systemd:
        name: auditd
        state: restarted
        daemon_reload: yes

    - name: "restart docker"
      systemd:
        name: docker
        state: restarted
        daemon_reload: yes

    - name: "restart nginx"
      systemd:
        name: nginx
        state: restarted
        daemon_reload: yes

    - name: "restart socat"
      systemd:
        name: socat-relay
        state: restarted
        daemon_reload: yes

    - name: "restart dnsmasq"
      systemd:
        name: dnsmasq
        state: restarted
        daemon_reload: yes
