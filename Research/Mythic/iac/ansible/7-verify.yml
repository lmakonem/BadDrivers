---
# 7-verify.yml - Verification and Integration Testing
# 8 integration tests: DNS, TLS, API health, container health, firewall, SSH hardening, auditd, backups

- name: "Integration Tests"
  hosts: all
  gather_facts: yes
  vars:
    test_results: []

  tasks:
    - name: "Test 1: DNS Resolution"
      block:
        - name: "Test DNS for Mythic server"
          shell: "nslookup {{ ansible_fqdn }} 8.8.8.8"
          register: dns_test
          when: "'mythic_servers' in group_names"

        - name: "Test DNS spoofing (redirector)"
          shell: "nslookup underdvr.exe localhost"
          register: dns_spoof_test
          when: "'redirectors' in group_names"

        - name: "Log DNS test result"
          set_fact:
            test_results: "{{ test_results + [{'test': 'DNS Resolution', 'status': 'PASS' if (dns_test.rc is not defined or dns_test.rc == 0) else 'FAIL'}] }}"

      rescue:
        - name: "DNS test failed"
          set_fact:
            test_results: "{{ test_results + [{'test': 'DNS Resolution', 'status': 'FAIL'}] }}"

    - name: "Test 2: TLS Certificate Validation"
      block:
        - name: "Check certificate file exists"
          stat:
            path: "{{ tls_cert_path }}"
          register: cert_stat

        - name: "Verify certificate is valid"
          openssl_certificate_info:
            path: "{{ tls_cert_path }}"
          register: cert_info
          when: cert_stat.stat.exists

        - name: "Check certificate expiration"
          assert:
            that:
              - cert_info.valid_at.start_date
              - cert_info.valid_at.end_date
            fail_msg: "Certificate validation failed"
          when: cert_stat.stat.exists

        - name: "Log TLS test result"
          set_fact:
            test_results: "{{ test_results + [{'test': 'TLS Certificate', 'status': 'PASS' if cert_stat.stat.exists else 'FAIL'}] }}"

      rescue:
        - name: "TLS test failed"
          set_fact:
            test_results: "{{ test_results + [{'test': 'TLS Certificate', 'status': 'FAIL'}] }}"

    - name: "Test 3: Mythic API Health (mythic_servers only)"
      block:
        - name: "Check Mythic API availability"
          uri:
            url: "https://localhost:{{ mythic_https_port }}/api"
            method: GET
            validate_certs: no
            status_code: 200
          register: api_test
          retries: 5
          delay: 5

        - name: "Log API health test result"
          set_fact:
            test_results: "{{ test_results + [{'test': 'Mythic API Health', 'status': 'PASS' if api_test.status == 200 else 'FAIL'}] }}"

      when: "'mythic_servers' in group_names"
      rescue:
        - name: "API health test failed"
          set_fact:
            test_results: "{{ test_results + [{'test': 'Mythic API Health', 'status': 'FAIL'}] }}"

    - name: "Test 4: Container Health"
      block:
        - name: "Check Docker daemon status"
          systemd:
            name: docker
          register: docker_status

        - name: "List running containers"
          shell: "docker ps --format '{{.Names}}' | wc -l"
          register: container_count

        - name: "Check for unhealthy containers"
          shell: "docker ps --filter 'health=unhealthy' --format '{{.Names}}' | wc -l"
          register: unhealthy_count

        - name: "Log container health test result"
          set_fact:
            test_results: "{{ test_results + [{'test': 'Container Health', 'status': 'PASS' if unhealthy_count.stdout == '0' else 'FAIL'}] }}"

      when: "'mythic_servers' in group_names"
      rescue:
        - name: "Container health test failed"
          set_fact:
            test_results: "{{ test_results + [{'test': 'Container Health', 'status': 'FAIL'}] }}"

    - name: "Test 5: Firewall Rules (UFW)"
      block:
        - name: "Check UFW status"
          shell: "ufw status | grep -q 'Status: active'"
          register: ufw_status

        - name: "List UFW rules"
          shell: "ufw show added | grep -c 'ufw allow'"
          register: ufw_rules_count

        - name: "Log firewall test result"
          set_fact:
            test_results: "{{ test_results + [{'test': 'Firewall (UFW)', 'status': 'PASS' if ufw_status.rc == 0 else 'FAIL'}] }}"

      rescue:
        - name: "Firewall test failed"
          set_fact:
            test_results: "{{ test_results + [{'test': 'Firewall (UFW)', 'status': 'FAIL'}] }}"

    - name: "Test 6: SSH Hardening"
      block:
        - name: "Check SSH password authentication is disabled"
          shell: "grep -q 'PasswordAuthentication no' /etc/ssh/sshd_config"
          register: ssh_passwd_check

        - name: "Check SSH root login is disabled"
          shell: "grep -q 'PermitRootLogin no' /etc/ssh/sshd_config"
          register: ssh_root_check

        - name: "Check SSH pubkey authentication is enabled"
          shell: "grep -q 'PubkeyAuthentication yes' /etc/ssh/sshd_config"
          register: ssh_pubkey_check

        - name: "Log SSH hardening test result"
          set_fact:
            test_results: "{{ test_results + [{'test': 'SSH Hardening', 'status': 'PASS' if (ssh_passwd_check.rc == 0 and ssh_root_check.rc == 0 and ssh_pubkey_check.rc == 0) else 'FAIL'}] }}"

      rescue:
        - name: "SSH hardening test failed"
          set_fact:
            test_results: "{{ test_results + [{'test': 'SSH Hardening', 'status': 'FAIL'}] }}"

    - name: "Test 7: Audit Daemon (auditd)"
      block:
        - name: "Check auditd is running"
          systemd:
            name: auditd
          register: auditd_status

        - name: "Check audit rules are loaded"
          shell: "auditctl -l | grep -c 'mythic'"
          register: audit_rules_count

        - name: "Log auditd test result"
          set_fact:
            test_results: "{{ test_results + [{'test': 'Audit Daemon (auditd)', 'status': 'PASS' if auditd_status.status.ActiveState == 'active' else 'FAIL'}] }}"

      rescue:
        - name: "Auditd test failed"
          set_fact:
            test_results: "{{ test_results + [{'test': 'Audit Daemon (auditd)', 'status': 'FAIL'}] }}"

    - name: "Test 8: Backup Configuration"
      block:
        - name: "Check backup script exists"
          stat:
            path: /opt/scripts/backup.sh
          register: backup_script

        - name: "Check backup cron job exists"
          shell: "crontab -l | grep -q 'backup.sh'"
          register: backup_cron
          failed_when: false

        - name: "Log backup test result"
          set_fact:
            test_results: "{{ test_results + [{'test': 'Backup Configuration', 'status': 'PASS' if backup_script.stat.exists else 'FAIL'}] }}"

      when: "'mythic_servers' in group_names"
      rescue:
        - name: "Backup test failed"
          set_fact:
            test_results: "{{ test_results + [{'test': 'Backup Configuration', 'status': 'FAIL'}] }}"

    - name: "Display test results"
      debug:
        msg: |
          ========================================
          Integration Test Results
          ========================================
          {% for result in test_results %}
          {{ result.test }}: {{ result.status }}
          {% endfor %}
          ========================================

    - name: "Verify all tests passed"
      assert:
        that:
          - test_results | map(attribute='status') | unique == ['PASS']
        fail_msg: "Some integration tests failed"

    - name: "Generate test report"
      copy:
        content: |
          Integration Test Report
          ========================
          Date: {{ ansible_date_time.iso8601 }}
          Host: {{ inventory_hostname }}
          Status: PASSED

          Test Results:
          {% for result in test_results %}
          - {{ result.test }}: {{ result.status }}
          {% endfor %}

          Environment:
          - Deployment Mode: {{ deployment_mode | upper }}
          - Hostname: {{ ansible_fqdn }}
          - IP Address: {{ ansible_default_ipv4.address }}
          - Kernel: {{ ansible_kernel }}
          - OS: {{ ansible_os_family }} {{ ansible_distribution_version }}

          Services Status:
          - Docker: {{ service_docker_status | default('N/A') }}
          - SSH: {{ service_ssh_status | default('N/A') }}
          - UFW: {{ service_ufw_status | default('N/A') }}
          - Auditd: {{ service_auditd_status | default('N/A') }}
        dest: "/tmp/mythic-test-report-{{ inventory_hostname }}.txt"
        mode: '0644'

    - name: "Verification phase complete"
      debug:
        msg: "All integration tests passed successfully!"
