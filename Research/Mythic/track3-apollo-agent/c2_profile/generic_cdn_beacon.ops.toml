# generic_cdn_beacon  --  OPS traffic-hardening reference  (source-of-truth: OPS-hygiene intent)
#
# ======================= GENERIC TRAFFIC SHAPE -- NOT ACTOR COVERAGE =======================
# Hardened GENERIC beacon for exercising NETWORK-HYGIENE analytics (N3 low URI cardinality,
# N6 real-cert TLS via the redirector) on the ops path. It is NOT attributed to any actor and
# MUST NOT be counted as FIN8/LockBit/Qilin coverage.
#
# For ACTOR-ATTRIBUTED emulation, do NOT use this file -- load one of the well-aligned actor
# profiles as raw_c2_config instead:
#   ../../profiles/lockbit-icbc.httpx.toml   (LockBit ICBC beacon)
#   ../../profiles/qilin-ocsp.httpx.toml     (Qilin OCSP-spoof)
# Build-time callback for the ops path MUST be the redirector FQDN on 443 (see ACTIVE-CONFIG.md),
# never a raw IP or a non-standard port.
# ==========================================================================================

name = "generic_cdn_beacon"

[get]
verb = "GET"
uris = ["/cdn/jquery.min.js", "/assets/bootstrap.min.js", "/js/app.bundle.js"]

[get.client]
headers.User-Agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
headers.Accept = "application/javascript, */*;q=0.8"
headers.Accept-Encoding = "gzip, deflate, br"
headers.Accept-Language = "en-US,en;q=0.9"
headers.Cache-Control = "no-cache"
headers.Pragma = "no-cache"

[get.client.message]
location = "body"
name = ""

[[get.client.transforms]]
action = "xor"
value = "mythic"

[[get.client.transforms]]
action = "base64url"
value = ""

[get.server]
headers.Content-Type = "application/javascript; charset=utf-8"
headers.Server = "nginx/1.24.0"
headers.Cache-Control = "public, max-age=31536000"
headers.ETag = "W/\"abc123\""

[[get.server.transforms]]
action = "base64url"
value = ""

[[get.server.transforms]]
action = "xor"
value = "mythic"

[post]
verb = "POST"
uris = ["/api/v1/analytics", "/beacon/report"]

[post.client]
headers.User-Agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
headers.Content-Type = "application/json"
headers.Accept = "*/*"

[post.client.message]
location = "body"
name = ""

[[post.client.transforms]]
action = "xor"
value = "mythic"

[[post.client.transforms]]
action = "base64url"
value = ""

[post.server]
headers.Content-Type = "application/json"
headers.Server = "nginx/1.24.0"

[[post.server.transforms]]
action = "base64url"
value = ""

[[post.server.transforms]]
action = "xor"
value = "mythic"
