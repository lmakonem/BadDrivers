---
- name: "Install http C2 profile (matches redteam-nana)"
  command: ./mythic-cli install github https://github.com/MythicC2Profiles/http -f
  args:
    chdir: "{{ mythic_base_path }}"
  register: http_install
  changed_when: true

- name: "Create Kassandra install wrapper directories"
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /tmp/kassandra-install/Payload_Type/Kassandra
    - /tmp/kassandra-install/C2_Profiles

- name: "Create minimal config.json for mythic-cli install"
  copy:
    dest: /tmp/kassandra-install/config.json
    content: '{"remote_images": {}}'

- name: "Copy Kassandra source into Payload_Type wrapper"
  synchronize:
    src: "{{ kassandra_local_path }}/"
    dest: /tmp/kassandra-install/Payload_Type/Kassandra/
    delete: yes
    recursive: yes
    rsync_opts:
      - "--exclude=.git"

- name: "Set kassandra_use_build_context=true in Mythic .env"
  lineinfile:
    path: "{{ mythic_base_path }}/.env"
    regexp: '^kassandra_use_build_context='
    line: 'kassandra_use_build_context=true'
    create: yes

- name: "Install Kassandra from local wrapper folder"
  command: "./mythic-cli install folder /tmp/kassandra-install -f"
  args:
    chdir: "{{ mythic_base_path }}"
  register: kassandra_install
  changed_when: true

- name: "Fix docker-compose build context case (mythic-cli writes lowercase, dir is Kassandra)"
  command: >
    sed -i 's|InstalledServices/kassandra|InstalledServices/Kassandra|g'
    {{ mythic_base_path }}/docker-compose.yml
  changed_when: true

- name: "Sync updated Kassandra source into InstalledServices (picks up Dockerfile fixes)"
  synchronize:
    src: "{{ kassandra_local_path }}/"
    dest: "{{ mythic_base_path }}/InstalledServices/Kassandra/"
    delete: yes
    recursive: yes
    rsync_opts:
      - "--exclude=.git"

- name: "Ensure panic=abort in Kassandra Cargo.toml (fixes GUI subsystem ntdll crash on Windows)"
  lineinfile:
    path: "{{ mythic_base_path }}/InstalledServices/Kassandra/Kassandra/agent_code/kassandra/Cargo.toml"
    regexp: '^#?panic\s*='
    line: 'panic = "abort"'
  changed_when: true

- name: "Rebuild Kassandra Docker image (installs nightly-2025-04-30 Rust target)"
  command: docker build -t kassandra {{ mythic_base_path }}/InstalledServices/Kassandra/
  async: 1800
  poll: 30
  changed_when: true

- name: "Remove stale kassandra container if present"
  command: docker rm -f kassandra
  ignore_errors: yes
  changed_when: true

- name: "Start Kassandra container via docker compose"
  command: docker compose up -d kassandra
  args:
    chdir: "{{ mythic_base_path }}"
  register: kassandra_compose_up
  changed_when: true

- name: "Wait for Kassandra to connect to RabbitMQ"
  shell: docker logs kassandra 2>&1 | grep -c 'Successfully connected to rabbitmq'
  register: kass_rabbitmq
  retries: 20
  delay: 10
  until: kass_rabbitmq.stdout | int > 0
  changed_when: false
  failed_when: false

- name: "Show install output"
  debug:
    msg:
      - "http: {{ http_install.stdout_lines | default([]) }}"
      - "kassandra: {{ kassandra_install.stdout_lines | default([]) }}"
      - "rabbitmq_connects: {{ kass_rabbitmq.stdout | default('0') }}"
