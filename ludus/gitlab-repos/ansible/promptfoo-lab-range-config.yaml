ludus:
  # ===========================================
  # CHATBOT SERVER - Ubuntu 22.04 with Ollama + Flask
  # ===========================================
  - vm_name: "{{ range_id }}-chatbot"
    hostname: "{{ range_id }}-chatbot"
    template: ubuntu-22.04-x64-server-template
    vlan: 20
    ip_last_octet: 50
    ram_gb: 16
    cpus: 8
    linux: true
    testing:
      snapshot: false
      block_internet: false
    roles:
      - ludus_promptfoo_lab
    role_vars:
      ludus_promptfoo_role_mode: "server"
      ludus_promptfoo_ollama_model: "llama3.2:3b"
      ludus_promptfoo_flask_port: 5000

  # ===========================================
  # STUDENT KALI VMs - PromptFoo attack platforms
  # ===========================================
  - vm_name: "{{ range_id }}-stu01-kali"
    hostname: "{{ range_id }}-stu01"
    template: kali-x64-desktop-template
    vlan: 20
    ip_last_octet: 101
    ram_gb: 4
    cpus: 2
    linux: true
    testing:
      snapshot: false
      block_internet: false
    roles:
      - ludus_promptfoo_lab
    role_vars:
      ludus_promptfoo_role_mode: "student"
      ludus_promptfoo_chatbot_server_ip: "10.2.20.50"
      ludus_promptfoo_chatbot_port: 5000

