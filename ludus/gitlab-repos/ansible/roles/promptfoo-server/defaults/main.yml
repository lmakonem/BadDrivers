---
# Defaults for promptfoo-server role
# Ubuntu server hosting the vulnerable chatbot with HuggingFace LLM

# HuggingFace configuration
hf_model: "mistralai/Mistral-7B-Instruct-v0.3"
hf_api_url: "https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.3"
hf_token: ""  # Set via role_vars or environment - required for rate limits

# Flask chatbot configuration
flask_port: 5000
flask_host: "0.0.0.0"

# Service user (ubuntu default)
service_user: "ubuntu"
service_group: "ubuntu"

# Lab directory
lab_dir: "/opt/chatbot"
