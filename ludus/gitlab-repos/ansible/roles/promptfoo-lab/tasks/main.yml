---
# PromptFoo AI Security Lab - Main Tasks
# Installs Ollama, Node.js, PromptFoo, and vulnerable Flask chatbot

- name: Wait for apt lock to be released
  shell: while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 5; done
  changed_when: false

# Fix Kali GPG key issues (common on older templates)
- name: Update Kali archive keyring
  shell: |
    curl -fsSL https://archive.kali.org/archive-key.asc | gpg --batch --dearmor -o /tmp/kali-archive-keyring.gpg
    cp /tmp/kali-archive-keyring.gpg /usr/share/keyrings/kali-archive-keyring.gpg
  args:
    creates: /tmp/kali-archive-keyring.gpg
  when: ansible_distribution == "Kali"
  ignore_errors: yes

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  retries: 3
  delay: 10
  register: apt_update
  until: apt_update is success

- name: Install required packages
  apt:
    name:
      - curl
      - wget
      - python3
      - python3-pip
      - python3-venv
      - python3-packaging
      - git
      - jq
    state: present

# ============================================
# Install Ollama
# ============================================
- name: Check if Ollama is installed
  stat:
    path: /usr/local/bin/ollama
  register: ollama_binary

- name: Download and install Ollama
  shell: curl -fsSL https://ollama.com/install.sh | sh
  args:
    creates: /usr/local/bin/ollama
  when: not ollama_binary.stat.exists

- name: Ensure Ollama service is running
  systemd:
    name: ollama
    state: started
    enabled: yes
    daemon_reload: yes

- name: Wait for Ollama to be ready
  wait_for:
    port: "{{ ollama_port }}"
    delay: 5
    timeout: 60

- name: Pull Ollama model (this may take several minutes)
  command: ollama pull {{ ollama_model }}
  register: ollama_pull
  changed_when: "'success' in ollama_pull.stdout or 'pulling' in ollama_pull.stdout"
  async: 600
  poll: 30

# ============================================
# Install Node.js and PromptFoo
# ============================================
- name: Install Node.js repository
  shell: |
    curl -fsSL https://deb.nodesource.com/setup_{{ nodejs_version }}.x | bash -
  args:
    creates: /etc/apt/sources.list.d/nodesource.list

- name: Install Node.js
  apt:
    name: nodejs
    state: present
    update_cache: yes

- name: Install PromptFoo globally
  npm:
    name: promptfoo
    global: yes
    state: present

# ============================================
# Set up vulnerable Flask chatbot
# ============================================
- name: Create lab directory
  file:
    path: "{{ flask_app_dir }}"
    state: directory
    owner: "{{ lab_user }}"
    group: "{{ lab_group }}"
    mode: "0755"

- name: Create Python virtual environment
  command: python3 -m venv {{ flask_app_dir }}/venv
  args:
    creates: "{{ flask_app_dir }}/venv"
  become_user: "{{ lab_user }}"

- name: Install Flask and requests in venv
  pip:
    name:
      - flask
      - requests
    virtualenv: "{{ flask_app_dir }}/venv"
  become_user: "{{ lab_user }}"

- name: Copy vulnerable chatbot application
  copy:
    src: app.py
    dest: "{{ flask_app_dir }}/app.py"
    owner: "{{ lab_user }}"
    group: "{{ lab_group }}"
    mode: "0644"
  notify: restart chatbot

- name: Copy lab status check script
  copy:
    src: check-status.sh
    dest: "{{ flask_app_dir }}/check-status.sh"
    owner: "{{ lab_user }}"
    group: "{{ lab_group }}"
    mode: "0755"

- name: Create chat helper script
  template:
    src: chat.sh.j2
    dest: "{{ flask_app_dir }}/chat.sh"
    owner: "{{ lab_user }}"
    group: "{{ lab_group }}"
    mode: "0755"

- name: Create PromptFoo config template
  template:
    src: promptfooconfig.yaml.j2
    dest: "{{ flask_app_dir }}/promptfooconfig.yaml"
    owner: "{{ lab_user }}"
    group: "{{ lab_group }}"
    mode: "0644"

- name: Create chatbot systemd service
  template:
    src: chatbot.service.j2
    dest: /etc/systemd/system/chatbot.service
    owner: root
    group: root
    mode: "0644"
  notify: restart chatbot

- name: Start and enable chatbot service
  systemd:
    name: chatbot
    state: started
    enabled: yes
    daemon_reload: yes

- name: Wait for chatbot to be ready
  wait_for:
    port: "{{ flask_port }}"
    delay: 3
    timeout: 30

# ============================================
# Create lab instructions
# ============================================
- name: Create lab README
  template:
    src: README.md.j2
    dest: "{{ flask_app_dir }}/README.md"
    owner: "{{ lab_user }}"
    group: "{{ lab_group }}"
    mode: "0644"

- name: Display lab setup complete message
  debug:
    msg: |
      PromptFoo AI Security Lab setup complete!
      
      Lab directory: {{ flask_app_dir }}
      Chatbot URL: http://localhost:{{ flask_port }}
      Ollama model: {{ ollama_model }}
      
      Run ~/lab/check-status.sh to verify the lab is working.
