---
# =============================================================================
# JichoDNS CI/CD Pipeline
# Deploys to 23.150.68.201 on push to main
#
# Required GitHub Secrets (Settings > Secrets > Actions):
#   ANSIBLE_VAULT_PASSWORD  - Password to decrypt ansible/group_vars/all/vault.yml
#   SSH_PRIVATE_KEY         - Private key matching the public key on the server
#   DEPLOY_HOST             - Target server IP (23.150.68.201)
#   DEPLOY_USER             - SSH username (plover)
# =============================================================================

name: Deploy JichoDNS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tags_filter:
        description: "Ansible tags to run (e.g. 'app' to only redeploy app)"
        required: false
        default: ""

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint & Test
  # ---------------------------------------------------------------------------
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # BLOCKING: byte-compile every module — catches syntax errors repo-wide,
      # not just the 3 files that used to be spot-checked.
      - name: Compile all backend modules
        run: |
          cd backend
          python -m compileall -q app

      # BLOCKING: ruff runs the real-bug rule set (E9/F63/F7/F82) configured in
      # backend/pyproject.toml — undefined names, broken f-strings, syntax.
      - name: Lint (ruff)
        run: |
          cd backend
          ruff check app

      # BLOCKING: the security regression suite must pass before we can deploy.
      - name: Run backend tests
        run: |
          cd backend
          pytest

  # ---------------------------------------------------------------------------
  # Job 2: Deploy via Ansible
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    # Gate: deploy only runs if the `test` job (compile + ruff + pytest) fully
    # succeeded. `needs` already blocks on success; the explicit `success()`
    # documents intent and survives future `if:` edits.
    needs: test
    # MANUAL-ONLY: production now runs on an INTERNAL VM (VM 119, reached via a
    # jump host on a non-standard SSH port) that GitHub-hosted runners cannot
    # reach, and the legacy DEPLOY_HOST (23.150.68.201) was decommissioned.
    # So a push to main runs the blocking test suite but does NOT auto-deploy;
    # deploys are performed manually (rsync + restart / image rebuild) or via an
    # explicit `workflow_dispatch` run once DEPLOY_HOST + SSH are re-pointed at
    # the current infra. This prevents merges from firing a broken/misdirected deploy.
    if: success() && github.event_name == 'workflow_dispatch'
    # Binds this job to the repo's Production environment. Add a MANUAL APPROVAL
    # gate in Settings > Environments > production > Required reviewers
    # (GitHub does not allow declaring reviewers in YAML). See ops action.
    environment:
      name: production
      url: http://${{ secrets.DEPLOY_HOST }}:3000
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible
        run: |
          pip install ansible-core

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install community.docker community.general ansible.posix

      - name: Write vault password file
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > ansible/.vault_password
          chmod 600 ansible/.vault_password

      - name: Write SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Run Ansible playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "false"
          ANSIBLE_FORCE_COLOR: "true"
        run: |
          cd ansible

          EXTRA_ARGS=""
          if [ -n "${{ github.event.inputs.tags_filter }}" ]; then
            EXTRA_ARGS="--tags ${{ github.event.inputs.tags_filter }}"
          fi

          ansible-playbook site.yml \
            --vault-password-file .vault_password \
            --private-key ~/.ssh/deploy_key \
            -e "ansible_ssh_common_args='-o StrictHostKeyChecking=no'" \
            $EXTRA_ARGS \
            -v

      - name: Verify deployment
        run: |
          echo "Waiting 30 seconds for services to start..."
          sleep 30
          echo "Checking API health..."
          curl -sf http://${{ secrets.DEPLOY_HOST }}:8000/health || echo "API health check pending - may still be starting"
          echo ""
          echo "Checking frontend..."
          curl -sf -o /dev/null -w "Frontend HTTP status: %{http_code}" http://${{ secrets.DEPLOY_HOST }}:3000 || echo "Frontend check pending"

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f ansible/.vault_password
          rm -f ~/.ssh/deploy_key

      - name: Deployment summary
        run: |
          echo "=============================================="
          echo "JichoDNS Deployment Complete"
          echo "=============================================="
          echo "Frontend:  http://${{ secrets.DEPLOY_HOST }}:3000"
          echo "API:       http://${{ secrets.DEPLOY_HOST }}:8000"
          echo "API Docs:  http://${{ secrets.DEPLOY_HOST }}:8000/docs"
          echo "Kibana:    http://${{ secrets.DEPLOY_HOST }}:5601"
          echo "=============================================="
