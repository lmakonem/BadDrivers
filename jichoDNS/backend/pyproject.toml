# backend/pyproject.toml
# Test + lint configuration for the JichoDNS backend.
# (No [build-system] table on purpose — this is a config-only pyproject;
#  pip install -r requirements.txt is unaffected.)

[tool.pytest.ini_options]
# pytest-asyncio 0.21.x: auto mode treats every `async def test_*` as an
# asyncio test with no per-test decorator required.
asyncio_mode = "auto"
testpaths = ["tests"]
# Make the `app` package importable when pytest runs from backend/ (pytest 7.x).
pythonpath = ["."]
addopts = "-ra -q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# BLOCKING baseline — the rules that catch real defects, mirroring flake8's
# classic "stop the build" set: syntax/runtime errors (E9), broken f-strings
# and assertions (F63/F7), and undefined/unused-in-__all__ names (F82).
# Style-only rules are intentionally excluded so this can be blocking today
# without churning the existing codebase.
select = ["E9", "F63", "F7", "F82"]
