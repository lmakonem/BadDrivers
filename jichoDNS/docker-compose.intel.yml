# =============================================================================
# JichoDNS Intel Stack — Dark Web + OSINT Collection
#
# Backend-only services on internal network. No public port exposure.
# Connects to existing jichodns-network to reach Elasticsearch, Redis, API.
#
# Usage:
#   docker compose -f docker-compose.intel.yml up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Tor SOCKS Proxy — provides .onion connectivity for TorBot
  # ---------------------------------------------------------------------------
  tor:
    image: dperson/torproxy:latest
    container_name: intel-tor
    restart: unless-stopped
    networks:
      - intel-net
    command: ""
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "curl", "-s", "--socks5", "localhost:9050", "https://check.torproject.org/api/ip"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # TorBot — OWASP dark web crawler
  # Crawls .onion seed URLs, writes JSON to shared volume
  # ---------------------------------------------------------------------------
  torbot:
    image: jichodns-torbot:latest
    container_name: intel-torbot
    restart: "no"
    depends_on:
      tor:
        condition: service_healthy
    networks:
      - intel-net
    volumes:
      - intel-data:/output
      - ./intel-config/torbot:/config:ro
    environment:
      - TOR_SOCKS_HOST=tor
      - TOR_SOCKS_PORT=9050
    mem_limit: 256m
    entrypoint: ["sleep", "infinity"]

  # ---------------------------------------------------------------------------
  # SpiderFoot — OSINT automation engine
  # Internal API on :5001, NOT exposed to host
  # ---------------------------------------------------------------------------
  spiderfoot:
    image: ctdc/spiderfoot:latest
    container_name: intel-spiderfoot
    restart: unless-stopped
    networks:
      - intel-net
      - jichodns-network  # Needs access to ES for direct indexing
    volumes:
      - spiderfoot-data:/var/lib/spiderfoot
    environment:
      - SF_DEBUG=0
    mem_limit: 512m
    healthcheck:
      # The ctdc/spiderfoot image ships wget (not curl) — the old curl test
      # never ran ("curl: executable file not found") and marked a healthy
      # SpiderFoot as unhealthy on every interval.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # NOTE: dark-collector and osint-collector run as Celery tasks
  # inside the existing jichodns-worker container. They don't need
  # separate containers — saves ~768MB RAM.
  # The worker has access to the intel-data volume via docker mount.

volumes:
  intel-data:
    driver: local
  spiderfoot-data:
    driver: local

networks:
  intel-net:
    driver: bridge
    # NOT internal — Tor and SpiderFoot need outbound internet access
  jichodns-network:
    external: true
    # Compose-generated name of the main stack's network (project "jichodns").
    # Was stale ("jichodns-network"), which broke recreating intel services.
    name: jichodns_jichodns-network
