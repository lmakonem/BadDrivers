version: "3.9"

services:
  # =============================================================================
  # DATABASES
  # =============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: jichodns-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jichodns
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jichodns_dev}
      POSTGRES_DB: jichodns
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Bind to localhost only — never expose the datastore on the LAN/all interfaces.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jichodns"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jichodns-network

  clickhouse:
    image: clickhouse/clickhouse-server:23.8-alpine
    container_name: jichodns-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: jichodns
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-jichodns_dev}
      CLICKHOUSE_DB: jichodns
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./backend/migrations/clickhouse_init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Bind to localhost only — never expose the datastore on the LAN/all interfaces.
      - "127.0.0.1:8123:8123"  # HTTP interface
      - "127.0.0.1:9000:9000"  # Native interface
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jichodns-network

  redis:
    image: redis:7-alpine
    container_name: jichodns-redis
    restart: unless-stopped
    # requirepass: Redis is the Celery broker AND the WS pub/sub bus, and it
    # shares jichodns-network with the intel stack (SpiderFoot/TorBot). Without a
    # password, any container on that network can inject Celery tasks = RCE in the
    # worker. The dev default keeps local `docker-compose up` working; prod sets
    # REDIS_PASSWORD in .env (and REDIS_URL carries it — see api/worker/scheduler).
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-jichodns_redis_dev}
    volumes:
      - redis_data:/data
    ports:
      # Bind to localhost only — unauthenticated Redis must never be reachable off-host.
      - "127.0.0.1:6379:6379"
    healthcheck:
      # Authenticated ping — an unauth ping now returns NOAUTH and would flap the
      # container unhealthy, blocking the service_healthy gate on api/worker.
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-jichodns_redis_dev}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jichodns-network

  # =============================================================================
  # BACKEND SERVICES
  # =============================================================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jichodns-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://jichodns:${POSTGRES_PASSWORD:-jichodns_dev}@postgres:5432/jichodns
      - CLICKHOUSE_URL=clickhouse://jichodns:${CLICKHOUSE_PASSWORD:-jichodns_dev}@clickhouse:9000/jichodns
      - REDIS_URL=redis://:${REDIS_PASSWORD:-jichodns_redis_dev}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      # Signs the admin (sqladmin) session cookie — kept distinct from SECRET_KEY
      # so the JWT key can rotate independently. Required in production.
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # External APIs
      - SHODAN_API_KEY=${SHODAN_API_KEY}
      - RIPE_ATLAS_API_KEY=${RIPE_ATLAS_API_KEY}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
      - OTX_API_KEY=${OTX_API_KEY}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY}
      # Payment providers
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY}
      - PAYSTACK_WEBHOOK_SECRET=${PAYSTACK_WEBHOOK_SECRET}
      # Vertex AI
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/gcp-credentials.json
    volumes:
      - ./backend:/app
      - ./credentials:/app/credentials:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jichodns-network
    # --proxy-headers + --forwarded-allow-ips: trust X-Forwarded-Proto/For from the
    # reverse proxy (Cloudflare tunnel via the docker bridge gateway) so redirects
    # are https and client IPs are correct. Dev trusts only loopback; prod sets
    # FORWARDED_ALLOW_IPS to its bridge gateway (e.g. 172.18.0.1) in .env.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers --forwarded-allow-ips=${FORWARDED_ALLOW_IPS:-127.0.0.1}

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jichodns-worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://jichodns:${POSTGRES_PASSWORD:-jichodns_dev}@postgres:5432/jichodns
      - CLICKHOUSE_URL=clickhouse://jichodns:${CLICKHOUSE_PASSWORD:-jichodns_dev}@clickhouse:9000/jichodns
      - REDIS_URL=redis://:${REDIS_PASSWORD:-jichodns_redis_dev}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      # Signs the admin (sqladmin) session cookie — kept distinct from SECRET_KEY
      # so the JWT key can rotate independently. Required in production.
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # External APIs
      - SHODAN_API_KEY=${SHODAN_API_KEY}
      - RIPE_ATLAS_API_KEY=${RIPE_ATLAS_API_KEY}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
      - OTX_API_KEY=${OTX_API_KEY}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY}
      # Vertex AI
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/gcp-credentials.json
    volumes:
      - ./backend:/app
      - ./credentials:/app/credentials:ro
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jichodns-network
    command: celery -A app.worker worker --loglevel=info --concurrency=4

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jichodns-scheduler
    environment:
      - DATABASE_URL=postgresql://jichodns:${POSTGRES_PASSWORD:-jichodns_dev}@postgres:5432/jichodns
      - CLICKHOUSE_URL=clickhouse://jichodns:${CLICKHOUSE_PASSWORD:-jichodns_dev}@clickhouse:9000/jichodns
      - REDIS_URL=redis://:${REDIS_PASSWORD:-jichodns_redis_dev}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      # Signs the admin (sqladmin) session cookie — kept distinct from SECRET_KEY
      # so the JWT key can rotate independently. Required in production.
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    volumes:
      - ./backend:/app
    depends_on:
      - worker
    networks:
      - jichodns-network
    command: celery -A app.worker beat --loglevel=info

  # =============================================================================
  # FRONTEND
  # =============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: jichodns-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_MAPBOX_TOKEN=${MAPBOX_TOKEN}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - jichodns-network

  # =============================================================================
  # MONITORING (optional, comment out if not needed)
  # =============================================================================
  # flower:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: jichodns-flower
  #   environment:
  #     - CELERY_BROKER_URL=redis://redis:6379/0
  #   ports:
  #     - "5555:5555"
  #   depends_on:
  #     - worker
  #   networks:
  #     - jichodns-network
  #   command: celery -A app.worker flower --port=5555

volumes:
  postgres_data:
  clickhouse_data:
  redis_data:

networks:
  jichodns-network:
    driver: bridge
