---
# =============================================================================
# Database role: PostgreSQL, ClickHouse, Redis, Elasticsearch, Kibana
# All run as Docker containers on the same host
# =============================================================================

- name: Create database data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ vault_ssh_user }}"
    group: "{{ vault_ssh_user }}"
    mode: "0755"
  loop:
    - "{{ app_dir }}/data"
    - "{{ app_dir }}/data/postgres"
    - "{{ app_dir }}/data/clickhouse"
    - "{{ app_dir }}/data/redis"
    - "{{ app_dir }}/data/elasticsearch"

- name: Set Elasticsearch directory ownership (uid 1000)
  ansible.builtin.file:
    path: "{{ app_dir }}/data/elasticsearch"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"

- name: Deploy database docker-compose file
  ansible.builtin.template:
    src: docker-compose.db.yml.j2
    dest: "{{ app_dir }}/docker-compose.db.yml"
    owner: "{{ vault_ssh_user }}"
    group: "{{ vault_ssh_user }}"
    mode: "0640"
  notify: restart database services

- name: Start database services
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    files:
      - docker-compose.db.yml
    state: present
  register: db_compose_result
  ignore_errors: true

- name: Fallback - start database services with shell
  ansible.builtin.shell: |
    cd {{ app_dir }} && docker compose -f docker-compose.db.yml up -d
  when: db_compose_result is failed
  changed_when: true

- name: Wait for PostgreSQL to be ready
  ansible.builtin.shell: |
    docker exec jichodns-postgres pg_isready -U {{ postgres_user }} 2>/dev/null
  register: pg_ready
  retries: 30
  delay: 5
  until: pg_ready.rc == 0
  changed_when: false

- name: Wait for Redis to be ready
  ansible.builtin.shell: |
    docker exec jichodns-redis redis-cli -a {{ vault_redis_password }} ping 2>/dev/null
  register: redis_ready
  retries: 20
  delay: 3
  until: "'PONG' in redis_ready.stdout"
  changed_when: false

- name: Wait for Elasticsearch to be ready
  ansible.builtin.uri:
    url: "http://localhost:{{ elasticsearch_port }}/_cluster/health"
    method: GET
    status_code: 200
    url_username: elastic
    url_password: "{{ vault_elasticsearch_password }}"
    force_basic_auth: true
  register: es_ready
  retries: 40
  delay: 10
  until: es_ready.status == 200
  ignore_errors: true
