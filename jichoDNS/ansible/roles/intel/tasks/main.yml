---
# Intel Stack Deployment — Tor, TorBot, SpiderFoot
# Runs on the same host as the main JichoSec stack

- name: Create intel directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"
  loop:
    - "{{ app_dir }}/intel-config/torbot"
    - "{{ app_dir }}/intel-data"

- name: Deploy intel compose file
  ansible.builtin.template:
    src: docker-compose.intel.yml.j2
    dest: "{{ app_dir }}/docker-compose.intel.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0644"

- name: Create TorBot seed URLs config
  ansible.builtin.copy:
    dest: "{{ app_dir }}/intel-config/torbot/seeds.txt"
    content: |
      # Dark web seed URLs for TorBot crawling
      # African threat landscape monitoring
      https://ahmia.fi/search/?q=africa+breach
      https://ahmia.fi/search/?q=credential+leak
      https://ahmia.fi/search/?q=kenya+hack
      https://ahmia.fi/search/?q=mpesa+fraud
      https://ahmia.fi/search/?q=banking+africa+leak
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0644"

- name: Clone TorBot from GitHub
  ansible.builtin.git:
    repo: https://github.com/DedSecInside/TorBot.git
    dest: /tmp/torbot-build
    depth: 1
    force: true

- name: Build TorBot Docker image
  community.docker.docker_image:
    name: jichodns-torbot
    tag: latest
    source: build
    build:
      path: /tmp/torbot-build
    force_source: true

- name: Clean up TorBot build directory
  ansible.builtin.file:
    path: /tmp/torbot-build
    state: absent

- name: Start intel stack containers
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    files: ["docker-compose.intel.yml"]
    state: present
  register: intel_compose

- name: Wait for Tor to bootstrap
  ansible.builtin.pause:
    seconds: 30

- name: Raise ES max_result_window for iocs index
  ansible.builtin.uri:
    url: "http://127.0.0.1:9200/iocs/_settings"
    method: PUT
    body_format: json
    body:
      index.max_result_window: 500000
    headers:
      Authorization: "Basic {{ ('elastic:' + vault_elasticsearch_password) | b64encode }}"
    status_code: [200]
  ignore_errors: true

- name: Trigger initial dark web crawl
  ansible.builtin.command:
    cmd: >
      docker exec jichodns-worker python -c
      "from app.worker import crawl_darkweb; crawl_darkweb.delay()"
  changed_when: true

- name: Trigger initial credential ingestion
  ansible.builtin.command:
    cmd: >
      docker exec jichodns-worker python -c
      "from app.worker import ingest_credentials; ingest_credentials.delay()"
  changed_when: true

- name: Display intel stack status
  ansible.builtin.debug:
    msg: "Intel stack deployed: Tor, TorBot, SpiderFoot + dark web crawl + credential ingestion triggered"
