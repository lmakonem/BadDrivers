---
# =============================================================================
# JichoDNS - Main Deployment Playbook
# Usage: ansible-playbook site.yml
# =============================================================================

- name: Deploy JichoDNS to production
  hosts: jichodns
  become: true
  gather_facts: true

  pre_tasks:
    - name: Validate target server is reachable
      ansible.builtin.ping:

    - name: Display deployment info
      ansible.builtin.debug:
        msg: |
          Deploying JichoDNS to {{ ansible_host }}
          Environment: {{ app_environment }}
          User: {{ vault_ssh_user }}

  roles:
    - role: common
      tags: [common, setup]
    - role: docker
      tags: [docker, setup]
    - role: database
      tags: [database, db]
    - role: app
      tags: [app, deploy]

  post_tasks:
    - name: Wait for services to be healthy
      ansible.builtin.uri:
        url: "http://localhost:{{ api_port }}/health"
        method: GET
        status_code: 200
      register: health_check
      retries: 30
      delay: 10
      until: health_check.status == 200
      ignore_errors: true

    - name: Display deployment summary
      ansible.builtin.debug:
        msg: |
          ====================================================
          JichoDNS Deployment Complete!
          ====================================================
          Frontend:  http://{{ server_ip }}:{{ expose_frontend_port }}
          API:       http://{{ server_ip }}:{{ expose_api_port }}
          API Docs:  http://{{ server_ip }}:{{ expose_api_port }}/docs
          Kibana:    http://{{ server_ip }}:{{ expose_kibana_port }}
          Health:    {{ 'HEALTHY' if health_check.status | default(0) == 200 else 'STARTING (check in a few minutes)' }}
          ====================================================
