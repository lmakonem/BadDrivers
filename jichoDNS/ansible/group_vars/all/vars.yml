---
# =============================================================================
# JichoDNS - Non-secret variables (safe to commit)
# Secrets are in vault.yml (encrypted)
# =============================================================================

# Application
app_name: jichodns
app_dir: /opt/jichodns
app_user: "{{ vault_ssh_user }}"
app_environment: production
app_log_level: INFO

# Server
server_ip: 23.150.68.201
server_hostname: jichodns-prod

# Docker
docker_compose_version: "2.24.0"

# Service ports (internal to Docker network, not exposed to host except where noted)
postgres_port: 5432
clickhouse_http_port: 8123
clickhouse_native_port: 9000
redis_port: 6379
elasticsearch_port: 9200
kibana_port: 5601
api_port: 8000
frontend_port: 3000

# Exposed host ports
expose_http_port: 80
expose_https_port: 443
expose_api_port: 8000
expose_frontend_port: 3000
expose_kibana_port: "127.0.0.1:5601"  # Localhost only — access via SSH tunnel

# Database settings
postgres_db: jichodns
postgres_user: jichodns
clickhouse_db: jichodns
clickhouse_user: jichodns

# Elasticsearch
elasticsearch_version: "8.12.0"
kibana_version: "8.12.0"

# Frontend build args (API accessed through nginx on port 80, not direct)
next_public_api_url: "http://{{ server_ip }}"

# Git repo (private - requires deploy key or token)
git_repo: "https://github.com/YOUR_ORG/jichoDNS.git"
git_branch: main

# Firewall allowed ports
firewall_allowed_ports:
  - "22/tcp"     # SSH
  - "80/tcp"     # HTTP
  - "443/tcp"    # HTTPS
  - "3000/tcp"   # Frontend (direct access)
  - "8000/tcp"   # API (direct access)
  # Kibana (5601) is NOT exposed — use SSH tunnel: ssh -L 5601:localhost:5601 plover@23.150.68.201

# System packages
system_packages:
  - git
  - curl
  - wget
  - htop
  - unzip
  - apt-transport-https
  - ca-certificates
  - gnupg
  - lsb-release
  - python3-pip
  - python3-venv
  - fail2ban
  - ufw
  - jq
